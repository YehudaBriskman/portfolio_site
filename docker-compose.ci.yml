services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/yehudabriskman/portfolio_site/web:latest}
    container_name: portfolio_site_web
    ports:
      - "8080:8080"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/yehudabriskman/portfolio_site/api:latest}
    container_name: portfolio_site_api
    expose:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: unless-stopped