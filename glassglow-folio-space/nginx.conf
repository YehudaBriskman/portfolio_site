log_format main_ext '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'uaddr=$upstream_addr ustatus=$upstream_status '
                    'host=$host req_id=$request_id';

access_log /dev/stdout main_ext;
error_log  /dev/stderr info;

gzip              on;
gzip_static       on;      # serve .gz built at image-build time, no per-request CPU
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types        application/javascript text/javascript text/css application/json
                  image/svg+xml application/manifest+json application/rss+xml;

resolver 10.43.0.10 valid=30s ipv6=off;   # cluster DNS (kube-dns)

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    proxy_pass http://api:5000/api/;
    proxy_http_version 1.1;

    proxy_set_header X-Request-Id       $request_id;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    proxy_read_timeout   60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout   60s;

    add_header X-Upstream-Addr   $upstream_addr   always;
    add_header X-Upstream-Status $upstream_status always;
    add_header X-Request-Id      $request_id      always;
  }

  location ~* \.(js|css|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
