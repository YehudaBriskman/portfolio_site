log_format main_ext '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'uaddr=$upstream_addr ustatus=$upstream_status '
                    'host=$host req_id=$request_id';

access_log /dev/stdout main_ext;
error_log  /dev/stderr info;

resolver 10.43.0.10 valid=30s ipv6=off;   # cluster DNS (kube-dns)

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    proxy_pass http://api:5000/api/;
    proxy_http_version 1.1;

    proxy_set_header X-Request-Id       $request_id;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    proxy_read_timeout   60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout   60s;

    add_header X-Upstream-Addr   $upstream_addr   always;
    add_header X-Upstream-Status $upstream_status always;
    add_header X-Request-Id      $request_id      always;
  }

  # Two fixed Prometheus queries, and nothing else. The query string is baked in
  # here rather than passed through, so this cannot be used to run arbitrary
  # PromQL against the cluster from the internet.
  # The upstream is held in a variable deliberately: with a literal hostname nginx
  # resolves at startup and refuses to boot if monitoring is down, which would take
  # the whole site with it. This way a missing Prometheus is just a failed fetch.
  set $prom "kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090";

  location = /telemetry/cpu {
    proxy_pass http://$prom/api/v1/query?query=100-%28avg%28rate%28node_cpu_seconds_total%7Bmode%3D%22idle%22%7D%5B5m%5D%29%29%2A100%29;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
    add_header Cache-Control "no-store" always;
  }

  location = /telemetry/memory {
    proxy_pass http://$prom/api/v1/query?query=100%2A%281-node_memory_MemAvailable_bytes%2Fnode_memory_MemTotal_bytes%29;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
    add_header Cache-Control "no-store" always;
  }

  location ~* \.(js|css|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
