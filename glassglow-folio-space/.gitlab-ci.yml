stages:
  - test
  - build
  - docker

test-fe:
  stage: test
  image: node:20
  script:
    - corepack enable
    - yarn install --frozen-lockfile || npm ci
    - yarn lint
    - yarn test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

build-fe:
  stage: build
  image: node:20
  script:
    - corepack enable
    - yarn install --frozen-lockfile || npm ci
    - yarn build
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
      - Dockerfile
      - package.json
      - package-lock.json
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

build-container:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --cache=true
  rules:
    - exists:
        - Dockerfile
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
  dependencies:
    - build-fe
