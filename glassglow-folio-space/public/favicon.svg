<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The site in one glyph: a sun resting on a ridgeline, with its reflection.
    Built to survive 16px — a warm disc above a dark band is still legible when
    everything else has collapsed, which is the only test a favicon has to pass.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1515"/>
      <stop offset="62%" stop-color="#1B2527"/>
      <stop offset="100%" stop-color="#3A4749"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A938F"/>
      <stop offset="100%" stop-color="#141B1B"/>
    </linearGradient>
    <clipPath id="above"><rect x="0" y="0" width="512" height="322"/></clipPath>
    <clipPath id="below"><rect x="0" y="322" width="512" height="190"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <g clip-path="url(#above)">
    <circle cx="256" cy="248" r="104" fill="#E8814A"/>
    <path d="M0,296 C74,268 132,290 196,286 C268,281 316,258 388,272 C444,283 482,276 512,282 L512,322 L0,322 Z" fill="#2E3E41"/>
    <path d="M0,312 C120,302 236,316 356,308 C424,303 470,312 512,306 L512,322 L0,322 Z" fill="#0F1515"/>
  </g>

  <g clip-path="url(#below)">
    <rect x="0" y="322" width="512" height="190" fill="url(#water)"/>
    <g transform="translate(0,644) scale(1,-1)" opacity="0.42">
      <circle cx="256" cy="248" r="104" fill="#E8814A"/>
    </g>
  </g>
</svg>
