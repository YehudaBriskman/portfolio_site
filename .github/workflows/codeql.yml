# CodeQL for the JavaScript and TypeScript in web/ and backend/ (#206).
#
# The one SAST tool, chosen because it is free on a public repository, needs
# no service account or paid seat, and reports into GitHub's own code
# scanning, where a ruleset can gate on it. Nothing else of the kind was in
# use, so this replaces nothing.
#
# `security-extended`: the default code-scanning queries plus the extra
# security queries of lower precision. No build step: JavaScript and
# TypeScript are analysed from source (`build-mode: none`).
#
# NOT A REQUIRED CHECK YET. Findings land in Security > Code scanning and are
# annotated on pull requests, but nothing blocks a merge until the owner adds
# a `code_scanning` rule to the "main: CI must pass" ruleset; the pull request
# that added this file says exactly how. Its own workflow rather than a CI
# job, so it never sits on CI's critical path or inside the CI gate.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 04:41 UTC: new queries and new advisories against code that
    # has not changed.
    - cron: "41 4 * * 1"

permissions:
  contents: read

# A newer push to a pull request makes the older analysis moot; main and the
# schedule each get a group of their own.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Uploading the results to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
