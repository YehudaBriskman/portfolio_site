# Close older Dependabot PRs when a newer one opens for the same ecosystem.
#
# Policy (see .github/dependabot.yml): at most one open Dependabot PR per
# ecosystem. Grouping plus `open-pull-requests-limit: 1` covers almost every
# case - Dependabot rebuilds the open group PR in place. This catches the rest:
#   - security updates, which open outside any group and ignore the limit;
#   - PRs left over from an older config (the pre-2026-11-02 per-major PRs);
#   - Dependabot opening a fresh group PR instead of rebasing a stale one.
# Without it those stack up beside the group PR and conflict with it on every
# merge, because they all rewrite the same lockfiles.
#
# The ecosystem is read from the branch name Dependabot always uses,
# `dependabot/<ecosystem>/...` (npm_and_yarn, docker, github_actions). The npm
# and docker entries each cover every directory, so one ecosystem is one PR.
#
# Which PRs to close is decided by .github/scripts/supersede-select.mjs
# (tested in CI's preflight job). A security update is closed only when the new
# PR provably bumps the same dependency, in the same directory, to the same or
# a higher version (#201): a newer group PR that lacks the fix must not drop it.
#
# Why pull_request_target: on a `pull_request` event raised by Dependabot,
# GITHUB_TOKEN is read-only whatever `permissions:` says, so the close would
# fail. pull_request_target runs in the base repository's context. It is safe
# here because nothing from the PR is checked out or executed: the checkout is
# the default branch (for the selection script), and the PR's number and branch
# reach the shell only through env, never through `${{ }}` in the script.

name: Dependabot supersede

on:
  # Deliberate, for the reason in the header: no PR code is checked out or run.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  supersede:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Close older open Dependabot PRs the new one supersedes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEW: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          fields=number,headRefName,title,body,labels
          gh pr view "$NEW" --json "$fields" > "$RUNNER_TEMP/new.json"
          gh pr list --author 'app/dependabot' --state open --limit 100 \
              --json "$fields" > "$RUNNER_TEMP/open.json"
          node .github/scripts/supersede-select.mjs "$RUNNER_TEMP/new.json" "$RUNNER_TEMP/open.json" |
          while read -r old; do
            echo "Closing #${old}: superseded by #${NEW}"
            gh pr close "$old" --delete-branch --comment "Superseded by #${NEW}"
          done
