# Is what is running what we think is running?
#
# Production fell fifty-five commits behind `main` and nothing said so (#102).
# The cause was benign — the deploy job fires on `refs/tags/v*` and no `v*` tag
# had ever been pushed, so the mechanism worked and was simply never triggered
# — but the silence was not. Two weeks of merged work sat undeployed while
# every signal anyone looks at stayed green: CI passed on every PR, `main` was
# healthy, and the site answered 200.
#
# Nothing here deploys anything. It reads the image tag off each running
# Deployment, resolves it back to a commit, and counts how far behind `main`
# that commit is. The counting is the whole feature: "prod is on 6782238" tells
# you nothing at a glance, and "prod is 55 commits behind" tells you everything.
#
# Why a separate workflow rather than a job in ci.yml: this has to run when
# nobody has pushed. That is exactly the condition it exists to detect, and a
# job in ci.yml can only run when ci.yml runs.
#
# The second question, same schedule (#206): is what is running still clean?
# A scan is evidence about the advisories known the day it ran. So the drift
# job also reads the exact digest each web and api Deployment runs in preprod
# and prod, and the Rescan job scans those digests with today's vulnerability
# database under CI's policy and exceptions file. It builds nothing and
# deploys nothing, and it holds no cluster credential: only the digests cross
# from one job to the other. A finding and a scanner error fail it
# differently (.github/scripts/rescan.sh), and the summary has a row per
# environment and component.
name: Deploy drift

on:
  schedule:
    # 07:00 UTC daily. Drift is a slow failure and a daily check catches it
    # long before it matters; anything more frequent is noise that teaches
    # people to ignore the notification.
    - cron: "0 7 * * *"
  workflow_dispatch:

# Read-only against the cluster and the repository. This workflow must never
# be the thing that changes a deployment.
permissions:
  contents: read

jobs:
  drift:
    name: Drift
    runs-on: ubuntu-latest
    # A tailnet join of up to a minute, then a few kubectl reads. Ten minutes
    # is several times that; a hung run should not hold a runner for six hours.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # [{env, app, image}] for web and api in preprod and prod.
      targets: ${{ steps.running.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repository is public, so the `git fetch` below needs no
          # credential, and none is left in .git/config (#206).
          persist-credentials: false
          # `git rev-list --count <sha>..origin/main` needs the history that
          # contains <sha>, and the default shallow clone does not have it.
          # A shallow checkout here fails as "unknown revision", which reads
          # like a broken deployment rather than a broken checkout.
          fetch-depth: 0

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      # Same two-step as the deploy job in ci.yml, and for the same measured
      # reason: joining the tailnet does not build a path to a specific peer.
      # Tailscale builds one lazily and the first packet is what builds it, so
      # kubectl discovering the route is kubectl timing out.
      - name: Wait for a path to the node
        # The node's tailnet address lives in a secret rather than in this
        # file because the repository is public. It is only reachable from
        # inside the tailnet, but there is no reason to publish it.
        env:
          NODE_IP: ${{ secrets.TAILNET_NODE_IP }}
        run: |
          set -uo pipefail
          if [ -z "$NODE_IP" ]; then
            echo "::error title=TAILNET_NODE_IP is not set::Add the cluster node's tailnet address as the repository secret TAILNET_NODE_IP."
            exit 1
          fi
          tailscale ping --timeout=5s -c 3 "$NODE_IP" || true
          for i in $(seq 1 20); do
            if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/$NODE_IP/6443' 2>/dev/null; then
              echo "API server answered after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error title=No path to the API server::Joined the tailnet but $NODE_IP:6443 never answered in 60s."
          tailscale status || true
          exit 1

      # Its own read-only token (#16): `get` on the web and api Deployments in
      # preprod and prod, nothing else (ci-drift in oci-free's
      # k8s/ci-rollout-rbac.yaml). It is a repository secret because this
      # job runs in no environment: a reviewer on `production` would hold a
      # daily cron forever. The deploy tokens can patch a whole pod template,
      # so they stay in their environments and never come here.
      - name: Point kubectl at the cluster
        env:
          KUBECONFIG_DRIFT: ${{ secrets.KUBECONFIG_DRIFT }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_DRIFT" ]; then
            echo "::error title=KUBECONFIG_DRIFT is not set::From the oci-free repository: ./k8s/ci-kubeconfig.sh drift | gh secret set KUBECONFIG_DRIFT. README.md there, 'Retiring the shared token', has the full order."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DRIFT" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # For the Rescan job: the image each Deployment's pod template names,
      # which since #205 is a digest. Before the drift check, which can fail
      # the job; a stale environment still deserves a scan.
      - name: Which digests are running
        id: running
        run: .github/scripts/rescan.sh targets

      # Two thresholds, because the two environments mean different things.
      #
      # preprod tracks `main` on every merge, so any drift at all is a failed
      # or skipped rollout. Three is slack for a merge landing while this job
      # runs, not a tolerance.
      #
      # prod moves only on a `v*` tag, so drift between releases is the design
      # working. Twenty-five is "you have a release's worth of work undeployed
      # and may not have noticed", which is the thing that actually went wrong
      # — not a demand to ship.
      - name: How far behind is each environment
        env:
          PREPROD_MAX: "3"
          PROD_MAX: "25"
        run: |
          set -uo pipefail
          git fetch -q origin main
          status=0

          {
            echo "| environment | running commit | behind \`main\` | limit |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for ns in preprod prod; do
            limit=$([ "$ns" = prod ] && echo "$PROD_MAX" || echo "$PREPROD_MAX")

            image=$(kubectl -n "$ns" get deploy api \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            if [ -z "$image" ]; then
              echo "::warning title=$ns unreachable::Could not read the api Deployment. Not treated as drift — an unreachable namespace is a different problem from a stale one."
              echo "| \`$ns\` | unreachable | — | — |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Since #205 Deploy rolls out `<repo>@sha256:<digest>`, which
            # names no commit, and records the commit in this annotation.
            # The image tag is the fallback for a Deployment rolled out
            # before that, or applied by hand.
            sha=$(kubectl -n "$ns" get deploy api \
              -o jsonpath='{.metadata.annotations.portfolio\.yehudabriskman\.com/source-sha}' 2>/dev/null || true)
            [ -n "$sha" ] || sha=${image##*:}
            # The manifests carry `:latest` as the tag a fresh `kubectl apply`
            # lands on, so a namespace that has been applied but never rolled
            # out reports a tag that is not a commit. That is worth saying out
            # loud rather than counting as zero.
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::warning title=$ns is not on a commit tag::The api image is tagged '$sha', which is not a commit in this repository. It has probably been applied but never rolled out."
              echo "| \`$ns\` | \`$sha\` (not a commit) | — | — |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            behind=$(git rev-list --count "${sha}..origin/main")
            short=$(git rev-parse --short "$sha")
            echo "| \`$ns\` | \`$short\` | **$behind** | $limit |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$behind" -gt "$limit" ]; then
              echo "::error title=$ns is $behind commits behind main::Running $short. The limit for $ns is $limit. For prod this means a release is overdue — deploys fire on a 'v*' tag and nothing else. For preprod it means a rollout failed or was skipped."
              status=1
            else
              echo "$ns is $behind commit(s) behind main (limit $limit)"
            fi
          done

          exit "$status"

  # The running digests against today's vulnerability database (#206), with
  # the policy and .trivyignore.yaml Scan image and Promote release use. No
  # tailnet and no kubeconfig here: the digests arrive as the drift job's
  # output, and this job only reads the registry.
  #
  #   exit 1  a running image fails the policy today: fix and release, or
  #           record a reviewed exception
  #   exit 2  a scanner error (DB download, stale DB, a scan that did not
  #           complete): nothing is known, which is not "clean"
  rescan:
    name: Rescan deployed images
    runs-on: ubuntu-latest
    needs: [drift]
    # Whether or not drift passed: a stale environment still runs an image.
    # Only when the drift job got as far as reading the Deployments.
    if: ${{ !cancelled() && needs.drift.outputs.targets != '' }}
    # A database download and up to four remote image scans.
    timeout-minutes: 20
    permissions:
      contents: read
      # Pulling the images' layers from GHCR.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy
        run: .github/scripts/rescan.sh install-trivy
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan what is running, with today's database
        env:
          TARGETS: ${{ needs.drift.outputs.targets }}
        run: .github/scripts/rescan.sh scan
