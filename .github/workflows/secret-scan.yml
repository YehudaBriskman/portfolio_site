# The weekly full-history secret scan (#206).
#
# Static (ci.yml) scans the commits each pull request and each push to main
# adds. That leaves what it cannot see: history from before it existed, a rule
# gitleaks has added since a commit was scanned, and branches nobody opened a
# pull request for. So once a week, every ref in a full clone, with the same
# pinned gitleaks and the same script (.github/scripts/secret-scan.sh).
#
# Redacted, like Static: the log names commit, file, line and rule, never the
# value, and no report is written or uploaded. A finding exits 3; gitleaks
# failing to run exits 2 and is not a clean result.
name: Secret scan

on:
  schedule:
    # Mondays 05:17 UTC, off the hour like any shared cron should be.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Full history (gitleaks)
    runs-on: ubuntu-latest
    # Measured locally: ~440 commits in two seconds. Ten minutes is for the
    # download and a slow clone.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Its own step: $GITHUB_PATH reaches the steps after it, not itself.
      - name: Install gitleaks
        run: .github/scripts/secret-scan.sh install
      - name: No secrets anywhere in history
        env:
          MODE: full
        run: .github/scripts/secret-scan.sh scan
