# Ported from .gitlab-ci.yml when the repository moved to GitHub.
#
# Two deliberate differences from the pipeline it replaces:
#
#   - Images are pushed on `main` only. GitLab pushed on every pipeline, which
#     filled the registry with one image per branch push and gave a pull request
#     write access to the tag production pulls.
#   - Jobs are no longer skipped by changed path. The per-path rules were half
#     the old file's length and the whole build is a few minutes; a skipped job
#     that should have run costs more than the minutes it saves.
#
# `typecheck` is new: the script existed and nothing ever ran it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONT_DIR: web
  BACK_DIR: backend
  # GHCR rejects uppercase, and the owner login has some.
  IMAGE_BASE: ghcr.io/yehudabriskman/portfolio_site
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every file the build assumes is present
        run: |
          set -Eeuo pipefail
          fail=0
          for f in \
            "$FRONT_DIR/package.json" "$FRONT_DIR/package-lock.json" \
            "$FRONT_DIR/Dockerfile" "$FRONT_DIR/nginx.conf" \
            "$BACK_DIR/package.json" "$BACK_DIR/package-lock.json" \
            "$BACK_DIR/Dockerfile" \
            docker-compose.yml docker-compose.ci.yml
          do
            if [ ! -f "$f" ]; then echo "::error file=$f::missing"; fail=1; fi
          done
          exit $fail

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report what shipped
        run: du -sh dist

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build

  dockerfiles:
    name: Dockerfiles
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        dir: [web, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dir }}/Dockerfile
          failure-threshold: error

  compose:
    name: Compose files parse
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -Eeuo pipefail
          for f in docker-compose.yml docker-compose.ci.yml; do
            echo "::group::$f"
            docker compose -f "$f" config >/dev/null
            echo "OK"
            echo "::endgroup::"
          done

  # A skipped matrix job never expands its matrix, so an interpolated job name
  # is reported verbatim: every pull request showed two checks literally called
  # "Publish ${{ matrix.name }} image". A static name lets Actions append the
  # leg itself — "Publish image (web)" when it runs, "Publish image" when it
  # does not — which is what the Dockerfiles job above has been doing all along.
  #
  # The matrix key is `image` rather than `name` for the same reason: a matrix
  # dimension called `name` sitting next to a job field called `name` reads as
  # though one sets the other.
  images:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [frontend, backend, dockerfiles, compose]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: web
          - image: api
            context: backend
    steps:
      - uses: actions/checkout@v4
      # The cluster these images are for runs on an arm64 node. An amd64-only
      # image cannot be pulled there at all, so a single-platform build would
      # publish something nothing can run.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # arm64 is emulated here, which is slow. It is still the cheaper
          # option than the current rollout, which builds on the node from
          # whatever happens to be in a laptop's working directory.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:latest
          # Replaces kaniko's --cache=true; the layer cache lives in Actions.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  scan:
    name: Scan image
    runs-on: ubuntu-latest
    needs: images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    # Reporting, not a gate - the same call the pipeline it replaces made.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: [web, api]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "0"
          ignore-unfixed: true
