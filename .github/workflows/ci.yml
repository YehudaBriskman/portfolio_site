# Ported from .gitlab-ci.yml when the repository moved to GitHub.
#
# Two deliberate differences from the pipeline it replaces:
#
#   - Images are pushed on `main` only. GitLab pushed on every pipeline, which
#     filled the registry with one image per branch push and gave a pull request
#     write access to the tag production pulls.
#   - Jobs are no longer skipped by changed path. The per-path rules were half
#     the old file's length and the whole build is a few minutes; a skipped job
#     that should have run costs more than the minutes it saves.
#
# `typecheck` is new: the script existed and nothing ever ran it.

name: CI

on:
  push:
    branches: [main]
    # Shipping is a decision somebody makes, not a side effect of merging.
    # `main` stays continuously integrated — every push is built, tested and
    # published — and a tag is what puts it in front of people. It also gives
    # a rollback a name: `v1.2.0` is something you can redeploy, where "the
    # commit before last Tuesday's merge" is something you have to go and find.
    #
    # A merge does roll out, but to `preprod` — a tailnet-only copy of the site
    # on its own host, so merged work has somewhere to be looked at before
    # anybody decides to tag it. Production still moves only on a tag.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONT_DIR: web
  BACK_DIR: backend
  # GHCR rejects uppercase, and the owner login has some.
  IMAGE_BASE: ghcr.io/yehudabriskman/portfolio_site
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every file the build assumes is present
        run: |
          set -Eeuo pipefail
          fail=0
          for f in \
            "$FRONT_DIR/package.json" "$FRONT_DIR/package-lock.json" \
            "$FRONT_DIR/Dockerfile" "$FRONT_DIR/nginx.conf.template" \
            "$BACK_DIR/package.json" "$BACK_DIR/package-lock.json" \
            "$BACK_DIR/Dockerfile" \
            docker-compose.yml docker-compose.ci.yml docker-compose.dev.yml \
            Makefile
          do
            if [ ! -f "$f" ]; then echo "::error file=$f::missing"; fail=1; fi
          done
          exit $fail

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report what shipped
        run: du -sh dist

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build

  dockerfiles:
    name: Dockerfiles
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        dir: [web, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dir }}/Dockerfile
          failure-threshold: error

  compose:
    name: Compose files parse
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      # The dev overlay is checked as an overlay, not on its own: it has no
      # build or image for `api`, because it only adds environment to the
      # service the base file defines. Parsed alone it is invalid, which is
      # why it needs its own entry rather than another name in a loop — and
      # why it went unchecked until `make up` started depending on it.
      - run: |
          set -Eeuo pipefail
          for files in \
            "-f docker-compose.yml" \
            "-f docker-compose.ci.yml" \
            "-f docker-compose.yml -f docker-compose.dev.yml"
          do
            echo "::group::docker compose $files"
            # shellcheck disable=SC2086
            docker compose $files config >/dev/null
            echo "OK"
            echo "::endgroup::"
          done

  # A skipped matrix job never expands its matrix, so an interpolated job name
  # is reported verbatim: every pull request showed two checks literally called
  # "Publish ${{ matrix.name }} image". A static name lets Actions append the
  # leg itself — "Publish image (web)" when it runs, "Publish image" when it
  # does not — which is what the Dockerfiles job above has been doing all along.
  #
  # The matrix key is `image` rather than `name` for the same reason: a matrix
  # dimension called `name` sitting next to a job field called `name` reads as
  # though one sets the other.
  images:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [frontend, backend, dockerfiles, compose]
    # Both: a main push so every commit is deployable the moment it is tagged,
    # and the tag itself so a tag on a commit that somehow never built still
    # produces an image rather than a rollout that fails looking for one. The
    # second build is almost entirely cache hits.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: web
          - image: api
            context: backend
    steps:
      - uses: actions/checkout@v4
      # The cluster these images are for runs on an arm64 node. An amd64-only
      # image cannot be pulled there at all, so a single-platform build would
      # publish something nothing can run.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # arm64 is emulated here, which is slow. It is still the cheaper
          # option than the current rollout, which builds on the node from
          # whatever happens to be in a laptop's working directory.
          platforms: linux/amd64,linux/arm64
          # The sha only. `latest` used to move on every merge, and the k8s
          # manifest carries `:latest` as the tag a fresh `kubectl apply`
          # lands on — so an apply between releases would have deployed
          # unreleased code without anybody choosing to. `latest` is now
          # written by the release step below and means the last release.
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ github.sha }}
          # Replaces kaniko's --cache=true; the layer cache lives in Actions.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Aliases, not rebuilds. `imagetools create` writes new tags against the
      # manifest that already exists, so the release carries the exact bytes
      # that were tested rather than a second build of the same source.
      - name: Name the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ github.ref_name }} \
            --tag ${{ env.IMAGE_BASE }}/${{ matrix.image }}:latest \
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ github.sha }}

  scan:
    name: Scan image
    runs-on: ubuntu-latest
    needs: images
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read
    # Reporting, not a gate - the same call the pipeline it replaces made.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: [web, api]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "0"
          ignore-unfixed: true

  # ----------------------------------------------------------------- deploy --
  #
  # The rollout, from a known commit, to one of two environments.
  #
  # A tag rolls out to `prod`; a push to `main` rolls out to `preprod`, which
  # is the same two Deployments in their own namespace on their own host, so
  # merged work can be looked at before anybody decides to release it.
  #
  # ONE job rather than two, and the ternaries at the top are the price of it.
  # The valuable part of this job is not `set image` — it is the preflight that
  # refuses to start a rollout the cluster cannot finish, the group that says
  # *why* a rollout stalled, the curl that distinguishes "rollout succeeded"
  # from "site answers", and the undo. Those are the things preprod most needs,
  # because preprod is where a bad build should be caught. Copied into a second
  # job they would be ~80 duplicated lines, and the first one to be fixed in
  # only one place turns preprod into an environment that tests a pipeline
  # nobody runs. Three expressions in one place is the cheaper duplication.
  #
  # The matrix alternative was rejected for a different reason: a matrix would
  # expand to both legs and need `if` on every step, and the two legs are
  # mutually exclusive — one ref is never both a tag and a branch.
  #
  # What this replaces: `deploy-portfolio.sh` in the oci-free repository, which
  # rsynced a laptop's WORKING DIRECTORY to the node, built there, and imported
  # into containerd. The live site could therefore be running code that was
  # never committed, and for six weeks it was. It had also quietly stopped
  # working altogether -- the script still synced a frontend directory that had
  # been renamed, rsync failed on the missing path, `set -e` aborted the run,
  # and nothing reported that the site had stopped updating.
  #
  # The cluster's API server is not reachable from the internet, by design:
  # SSH and the Kubernetes API both go over Tailscale and neither is exposed.
  # So the runner joins the tailnet for the length of the job with an ephemeral
  # node, rather than the alternative, which is opening the API to the world so
  # that a CI runner can talk to it.
  #
  # `set image` with the commit sha, not `rollout restart` against :latest. A
  # restart against a moving tag redeploys whatever that tag points at now,
  # which is not necessarily this commit and is not reproducible; an immutable
  # tag means the rollout either lands this build or fails.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: images
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # One rollout at a time per environment. Two merges in quick succession
    # would otherwise race, and the loser could finish second with the older
    # image. Per environment rather than globally: a tag and a merge touch
    # different namespaces and have no reason to queue behind each other.
    concurrency:
      group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'preprod' }}
      cancel-in-progress: false
    # The `production` environment is where a required reviewer goes if a human
    # step before a live rollout is ever wanted; `preprod` deliberately has
    # none, since being able to look at `main` without asking is the point.
    #
    # Note for whoever adds that reviewer: if KUBECONFIG_B64 or the Tailscale
    # secrets are ever moved from repository secrets to *environment* secrets
    # on `production`, they must be added to `preprod` too, or this job starts
    # failing on every merge with an empty kubeconfig.
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preprod' }}
      url: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://yehudabriskman.com/' || 'https://preprod.yehudabriskman.com/' }}
    permissions:
      contents: read
    # What differs between the two environments, resolved once here so no step
    # below has to ask which one it is in. The third difference — what the
    # rollout is called — is computed in the rollout step itself, because
    # workflow expressions cannot take a substring of a sha.
    env:
      DEPLOY_NS: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'preprod' }}
      DEPLOY_URL: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://yehudabriskman.com/' || 'https://preprod.yehudabriskman.com/' }}
      # What a healthy answer looks like, and it differs by environment.
      #
      # Prod is public and must return 200. Preprod is behind a forwardAuth
      # gate, so the healthy answer to an unauthenticated request — which is
      # all CI can make — is a 302 to the identity provider. Asserting 200
      # there is asserting the gate is broken, and this check did exactly
      # that: the first green rollout to preprod was undone by its own health
      # check, which is the correct behaviour applied to the wrong premise.
      #
      # Not "any 2xx or 3xx": a redirect loop and a gate look identical under
      # that rule, and the whole point of this step is to disbelieve the
      # rollout. One expected code per environment.
      DEPLOY_EXPECT: ${{ startsWith(github.ref, 'refs/tags/v') && '200' || '302' }}
    steps:
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Ephemeral, so the runner leaves no device behind in the tailnet
          # when the job ends.
          version: latest

      # Through the environment, not interpolated into the script. A secret
      # expanded by the workflow templater becomes part of the command line,
      # where `set -x`, a shell error or anything that echoes the command can
      # print it; base64 so the embedded newlines survive the round trip
      # without depending on how the value was pasted into the secret.
      # The tailnet is up before this step, but a path to a specific peer is
      # not: Tailscale builds one lazily, and the first packet is what builds
      # it. The first real rollout joined the tailnet successfully and then
      # timed out on the API server sixty-four seconds later, because kubectl
      # was the thing discovering the route and kubectl does not retry.
      #
      # So: ping to force path discovery, then poll the port until it answers.
      # A minute is generous for a relay to come up and still finishes long
      # before kubectl's own 32-second-per-call timeout becomes the clock.
      - name: Wait for a path to the node
        run: |
          set -uo pipefail
          tailscale status --peers=false || true
          tailscale ping --timeout=5s -c 3 100.79.242.82 || true
          for i in $(seq 1 20); do
            if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/100.79.242.82/6443' 2>/dev/null; then
              echo "API server answered after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error title=No path to the API server::Joined the tailnet but 100.79.242.82:6443 never answered in 60s. A timeout is a dropped packet rather than a refused connection, so look at the tailnet before the cluster: is the ephemeral node listed below, and does the policy permit its tag to reach that port?"
          tailscale status || true
          tailscale netcheck || true
          exit 1

      - name: Point kubectl at the cluster
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64" || { echo "KUBECONFIG_B64 is not set" >&2; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          # The kubeconfig's own context says `prod`; every call passes -n, so
          # one credential serves both namespaces. The RBAC behind it grants
          # the same two verbs on the same two Deployment names in each.
          if ! kubectl -n "$DEPLOY_NS" get deploy web api -o name; then
            echo "::error title=Nothing to roll out in $DEPLOY_NS::Either the namespace has not been set up yet or the token is not bound in it. For a first preprod rollout, from the oci-free repository: kubectl apply -f k8s/portfolio-preprod.yaml -f k8s/tailnet-only-middleware.yaml -f k8s/ci-rollout-rbac.yaml && ./k8s/preprod-secrets.sh"
            exit 1
          fi

      # The manifest lives in another repository, and merging it there does
      # nothing to the cluster until somebody runs `kubectl apply`. Nothing
      # reports that gap, and it cost this pipeline its first green rollout:
      # the deployments still carried `imagePullPolicy: Never` from the old
      # build-on-the-node arrangement, `set image` changed the tag but not the
      # policy, and both new pods sat in ErrImageNeverPull until the five
      # minute rollout timeout gave up and undid the whole thing.
      #
      # Two seconds of assertion in exchange for that. It cannot apply the
      # manifest — that repository is not checked out here, and reaching for
      # it would mean another credential — but it can refuse to start a
      # rollout the cluster is not configured to complete, and say which
      # command closes the gap.
      #
      # It runs for preprod too, where the same drift is likelier rather than
      # less: preprod is applied by hand once and then left for weeks.
      - name: The cluster can actually pull
        run: |
          set -euo pipefail
          bad=0
          for d in web api; do
            policy=$(kubectl -n "$DEPLOY_NS" get deploy "$d" \
              -o jsonpath='{.spec.template.spec.containers[0].imagePullPolicy}')
            secrets=$(kubectl -n "$DEPLOY_NS" get deploy "$d" \
              -o jsonpath='{.spec.template.spec.imagePullSecrets[*].name}')
            echo "$d: imagePullPolicy=$policy imagePullSecrets=[${secrets:-none}]"
            [ "$policy" = "Never" ] && { echo "  ^ cannot pull from a registry"; bad=1; }
            case " $secrets " in *" ghcr-pull "*) ;; *) echo "  ^ no ghcr-pull secret"; bad=1;; esac
          done
          if [ "$bad" = 1 ]; then
            manifest=$([ "$DEPLOY_NS" = prod ] && echo k8s/portfolio.yaml || echo k8s/portfolio-preprod.yaml)
            echo "::error title=The cluster has drifted from its manifest::The live Deployments in $DEPLOY_NS are not configured to pull from GHCR, so this rollout would stall in ErrImageNeverPull. Apply the manifest from the oci-free repository first: kubectl apply -f $manifest"
            exit 1
          fi

      # Both environments roll out the commit sha. Preprod does NOT roll out
      # `:latest` and does not write it: `:latest` means the last release, and
      # it means that because the k8s manifests carry it as the tag a fresh
      # `kubectl apply` lands on. A preprod that moved `:latest` on every merge
      # would put unreleased code behind a production apply, which is the exact
      # failure the tag split was introduced to remove.
      - name: Roll out this commit
        id: rollout
        run: |
          set -euo pipefail
          kubectl -n "$DEPLOY_NS" set image deploy/web \
            web=${{ env.IMAGE_BASE }}/web:${{ github.sha }}
          kubectl -n "$DEPLOY_NS" set image deploy/api \
            api=${{ env.IMAGE_BASE }}/api:${{ github.sha }}
          # The rollout runs on the sha because a sha cannot move and a git
          # tag can. The version goes on as an annotation so `kubectl describe`
          # can still answer "which release is this" without anybody having to
          # map forty hex characters back to a name. On preprod there is no
          # release to name, so it carries the branch and the short sha —
          # enough to paste straight into `git show`.
          if [ "$DEPLOY_NS" = prod ]; then
            release="${{ github.ref_name }}"
          else
            release="main-${GITHUB_SHA:0:7}"
          fi
          for d in web api; do
            kubectl -n "$DEPLOY_NS" annotate deploy "$d" --overwrite \
              app.kubernetes.io/version="$release" \
              portfolio.yehudabriskman.com/released-at="$(date -u +%FT%TZ)"
          done
          # `rollout status` reports that it gave up, never why. A pull
          # failure is the likeliest reason and is invisible without this.
          # On a first preprod rollout the likeliest reason is instead a
          # missing secret — the pods wait in CreateContainerConfigError,
          # which the REASON column below names.
          for d in web api; do
            if ! kubectl -n "$DEPLOY_NS" rollout status "deploy/$d" --timeout=300s; then
              echo "::group::why $d did not come up"
              kubectl -n "$DEPLOY_NS" get pods -l "app=$d" \
                -o custom-columns='POD:.metadata.name,PHASE:.status.phase,REASON:.status.containerStatuses[0].state.waiting.reason,MSG:.status.containerStatuses[0].state.waiting.message'
              kubectl -n "$DEPLOY_NS" describe deploy "$d" | tail -20
              echo "::endgroup::"
              exit 1
            fi
          done

      # A rollout that reports success and a site that does not answer are
      # different things, and only one of them is what was wanted.
      #
      # The preprod host is tailnet-only — a Traefik ipAllowList on
      # 100.64.0.0/10, and its DNS record points at the node's tailnet
      # address. This check therefore only passes because the runner is still
      # on the tailnet from the first step, which also means a 403 here is a
      # statement about the tailnet rather than about the build. Said out loud
      # in the failure message, because it is not a guess anybody should have
      # to make twice.
      - name: Check the site actually answers
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$DEPLOY_URL" || true)
            echo "attempt $i: $code (expecting $DEPLOY_EXPECT)"
            [ "$code" = "$DEPLOY_EXPECT" ] && exit 0
            sleep 6
          done
          echo "::error title=$DEPLOY_NS did not answer $DEPLOY_EXPECT::$DEPLOY_URL never returned $DEPLOY_EXPECT after the rollout. On preprod a 302 is healthy and means the forwardAuth gate answered; a 200 there means the gate is open, which is its own problem. A 403 on either means Traefik refused before reaching the app, and anything 5xx is the build."
          exit 1

      # Only when a rollout actually started. Unreachable cluster means there
      # is nothing to undo, and four more kubectl calls against an API that is
      # not answering is two further minutes of the same timeout.
      - name: Put it back if it did not
        if: failure() && steps.rollout.outcome == 'success'
        run: |
          kubectl -n "$DEPLOY_NS" rollout undo deploy/web || true
          kubectl -n "$DEPLOY_NS" rollout undo deploy/api || true
          kubectl -n "$DEPLOY_NS" rollout status deploy/web --timeout=180s || true
          kubectl -n "$DEPLOY_NS" rollout status deploy/api --timeout=180s || true
