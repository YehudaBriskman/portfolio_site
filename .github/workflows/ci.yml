# CI for this repository.
#
# Images are pushed on `main` only, so a pull request never gets write access to
# the tag production pulls. Pull requests are narrowed by one tested script
# (.github/scripts/ci-classify.mjs, the `classify` job) that selects everything
# whenever it is unsure, and one `CI gate` job fails on any skip classification
# did not ask for. Main and tags run everything.

name: CI

on:
  push:
    branches: [main]
    # Shipping is a decision somebody makes, not a side effect of merging.
    # `main` stays continuously integrated — every push is built, tested and
    # published — and a tag is what puts it in front of people. It also gives
    # a rollback a name: `v1.2.0` is something you can redeploy, where "the
    # commit before last Tuesday's merge" is something you have to go and find.
    #
    # A merge does roll out, but to `preprod` — a tailnet-only copy of the site
    # on its own host, so merged work has somewhere to be looked at before
    # anybody decides to tag it. Production still moves only on a tag.
    #
    # A tag builds nothing (#205). Main CI builds both images once, scans
    # them, and records their digests in a release manifest in GHCR; the tag
    # resolves to one commit, checks it is on main, fetches the manifest main
    # wrote for exactly that commit, re-scans those digests against today's
    # vulnerability database, and deploys them. No manifest, no release.
    tags: ["v*"]
  pull_request:
  # Both inputs mean something only when run from a v* tag ("Use workflow
  # from" the tag). On main and other branches they are ignored.
  workflow_dispatch:
    inputs:
      rebuild:
        description: >-
          From a v* tag only: build, test and scan the tag's commit again in
          this run, record a fresh manifest, and promote that. For a commit
          main never recorded. Every gate main runs still runs.
        type: boolean
        default: false
      rollback:
        description: >-
          From a v* tag only: allow deploying a release older than the one
          prod runs. Without it an older tag is refused.
        type: boolean
        default: false

permissions:
  contents: read

# A second push to a pull request makes the first run's answer worthless, so
# that run is cancelled. Nothing else is: every other event gets a group of
# its own (the run id), so a push to main or a tag never waits behind, and is
# never cancelled by, another run. A shared group would not be safe even with
# cancel-in-progress off - a group holds one pending run, and a third arrival
# cancels the one that was waiting. Deploy never runs on a pull request, and
# keeps its own per-environment group below with cancel-in-progress: false.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FRONT_DIR: web
  BACK_DIR: backend
  # GHCR rejects uppercase, and the owner login has some.
  IMAGE_BASE: ghcr.io/yehudabriskman/portfolio_site
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  # Which jobs this change needs (#203). The rules, and why each one, are in
  # the script's header; its table tests run in Static. The workflow itself
  # always runs (no top-level `paths:`): a required check that never starts
  # blocks a merge forever, and one that is filtered out reads as a pass.
  #
  # Full history (`fetch-depth: 0`) so the diff comes from local git: the
  # merge-base of a pull request, or a push's `before`, has to be in the
  # clone. The API's changed-file list is paginated and capped, and a
  # truncated list looks exactly like a small change. Anything git cannot
  # answer selects everything.
  #
  # Event fields reach the script through env, never `${{ }}` in the script.
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.classify.outputs.ok }}
      jobs: ${{ steps.classify.outputs.jobs }}
      scan_matrix: ${{ steps.classify.outputs.scan_matrix }}
      # pr | main | promote | rebuild | other, and the commit this run is
      # about: a tag is resolved to its commit here, once, and every later
      # job uses this rather than github.sha (#205).
      mode: ${{ steps.classify.outputs.mode }}
      sha: ${{ steps.classify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        name: Select jobs from the changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REBUILD: ${{ inputs.rebuild }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-classify.mjs

  # Every check that needs only the source: no install, no build. These were
  # four jobs (Preflight, Dockerfiles x2, Compose files parse) of a few seconds
  # each, every one paying for its own runner and checkout; they are steps of
  # one job now, and the workflow lint joined them.
  #
  # `!cancelled()` on every step after the checkout, so one failing assertion
  # does not hide the next - the separate jobs used to report independently,
  # and the Dockerfiles matrix had fail-fast off for the same reason.
  #
  # Frontend and Backend do not wait for this job. It used to gate them, which
  # cost nothing when it was ten seconds of file checks; with hadolint and the
  # workflow lint in it, it would sit on the critical path. Nothing is
  # published unless it passes: Scan and Publish image both need it.
  static:
    name: Static
    runs-on: ubuntu-latest
    # Measured ~1 min; ten covers a slow image pull for hadolint.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The secret scan reads every commit a pull request adds, and a
          # push's `before`, from local git (#206).
          fetch-depth: 0
      - name: Dependabot supersede keeps security updates it cannot prove covered (#201)
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/supersede-select.test.mjs
      # The selection and the gate decide which checks run at all, so a bug
      # in either removes coverage silently. Here rather than in `classify`
      # so a docs-only change still runs them.
      - name: Change classification and the CI gate (#203)
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/ci-classify.test.mjs .github/scripts/ci-gate.test.mjs

      # Secrets (#206): gitleaks over the commits this event adds - a pull
      # request's base..head, every intermediate commit included, and a push
      # to main's before..after. A secret committed and deleted two commits
      # later is still published by the merge. Redacted: the log names the
      # commit, file, line and rule, never the value, and no report is
      # written. The weekly full-history scan is secret-scan.yml. Event
      # fields reach the script through env only.
      # Its own step: $GITHUB_PATH reaches the steps after it, not itself.
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        run: .github/scripts/secret-scan.sh install
      - name: No secrets in the new commits (gitleaks)
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: .github/scripts/secret-scan.sh scan

      # Every accepted scanner finding has a reason, an owner and an expiry
      # at most three months out, and none has expired (#206). Trivy would
      # start failing on an expired entry anyway - on the day of a release.
      # This fails it in review instead. yq ships on the runner image.
      - name: Scanner exceptions are reasoned, owned and unexpired
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          node --test .github/scripts/exceptions-check.test.mjs
          yq -o=json .trivyignore.yaml | node .github/scripts/exceptions-check.mjs .trivyignore.yaml
      - name: Every file the build assumes is present
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          fail=0
          for f in \
            "$FRONT_DIR/package.json" "$FRONT_DIR/package-lock.json" \
            "$FRONT_DIR/Dockerfile" "$FRONT_DIR/nginx.conf.template" \
            "$FRONT_DIR/security-headers.conf" \
            "$BACK_DIR/package.json" "$BACK_DIR/package-lock.json" \
            "$BACK_DIR/Dockerfile" \
            docker-compose.yml docker-compose.ci.yml docker-compose.dev.yml \
            Makefile
          do
            if [ ! -f "$f" ]; then echo "::error file=$f::missing"; fail=1; fi
          done
          exit $fail

      # nginx's `add_header` replaces the inherited set rather than extending
      # it: a location that declares one header of its own loses every header
      # the server block declared. That is not a thing anybody spots in review
      # — it cost the live site its HSTS, nosniff, Referrer-Policy and CSP on
      # the JS bundle, the webmanifest, the images, the fonts, the HTML 404
      # and every /api/ response, for as long as those blocks had existed.
      #
      # So it is checked rather than remembered. Any location that sets a
      # header must also include security-headers.conf; a location that sets
      # none inherits correctly and is left alone. Brace depth rather than a
      # grep, so a block's headers are attributed to that block.
      - name: Every location that sets a header keeps the security headers
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          bad=$(awk '
            /^[[:space:]]*location[[:space:]]/ { inloc = 1; name = $0; adds = 0; incs = 0; depth = 0 }
            inloc {
              if ($0 ~ /add_header/)              adds = 1
              if ($0 ~ /security-headers\.conf/)  incs = 1
              depth += gsub(/\{/, "{")
              depth -= gsub(/\}/, "}")
              if (depth <= 0) {
                if (adds && !incs) { sub(/^[[:space:]]+/, "", name); print "  " name }
                inloc = 0
              }
            }
          ' "$FRONT_DIR/nginx.conf.template")
          if [ -n "$bad" ]; then
            echo "::error file=$FRONT_DIR/nginx.conf.template::These locations set a header of their own and so drop the server-level security headers. Add 'include /etc/nginx/snippets/security-headers.conf;' to each:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK"

      # Was the `Dockerfiles` matrix job; one step per file so each reports.
      - name: Dockerfile lint (web)
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: web/Dockerfile
          failure-threshold: error
      - name: Dockerfile lint (backend)
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      # Was the `Compose files parse` job.
      #
      # The dev overlay is checked as an overlay, not on its own: it has no
      # build or image for `api`, because it only adds environment to the
      # service the base file defines. Parsed alone it is invalid, which is
      # why it needs its own entry rather than another name in a loop — and
      # why it went unchecked until `make up` started depending on it.
      - name: Compose files parse
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          for files in \
            "-f docker-compose.yml" \
            "-f docker-compose.ci.yml" \
            "-f docker-compose.yml -f docker-compose.dev.yml"
          do
            echo "::group::docker compose $files"
            # shellcheck disable=SC2086
            docker compose $files config >/dev/null
            echo "OK"
            echo "::endgroup::"
          done

      # The workflows are code that holds a registry token and a kubeconfig;
      # they get linted like code. actionlint for correctness (expressions,
      # needs, shellcheck over every `run:`), zizmor for security (unpinned
      # actions, template injection, credential persistence). Exact versions:
      # actionlint's tarball is checked against the sha256 its release
      # publishes, and zizmor is pinned on PyPI. Bumping either is a deliberate
      # edit here - a new rule should arrive in a pull request, not on Monday.
      - name: Workflow lint (actionlint)
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -Eeuo pipefail
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Workflow security lint (zizmor)
        if: ${{ !cancelled() }}
        env:
          ZIZMOR_VERSION: 1.31.1
          # Read-only; lets the online audits resolve pinned commits and
          # check that each version comment matches the sha it sits beside.
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec "zizmor==${ZIZMOR_VERSION}" zizmor --format github .

      # The Deploy job's rollback, readiness and stale-deploy logic, against a
      # fake kubectl, curl and oras; the publish path's proof that it pushes
      # the scanned image, against a fake docker; and the release manifest's
      # checks (tag on main, missing or mismatched manifest, the run that
      # wrote it), against a fake registry and API (#205). All of them only
      # ever run for real on main or a tag, after a merge, which is the worst
      # place to find out they are wrong.
      - name: Deploy, publish and release scripts lint clean and their decisions hold
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          shellcheck .github/scripts/*.sh
          bash .github/scripts/deploy.test.sh
          bash .github/scripts/candidate.test.sh
          bash .github/scripts/release.test.sh
          bash .github/scripts/rescan.test.sh
          bash .github/scripts/secret-scan.test.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [classify]
    if: fromJSON(needs.classify.outputs.jobs).frontend
    # The browser checks moved to their own job (Browser checks, below), so
    # this is install, lint, typecheck, unit tests and build. Measured before
    # the split: those steps ~1.6 min of a 13-14 min job (2026-11-04, 8 runs;
    # the unit tests ~46 s of it). Ten is room for a cold npm cache.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      # Off a pull request, the commit classification resolved: the same one
      # Scan image builds, which matters for a rebuild from a tag (#205).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.classify.outputs.sha || '' }}
      # The npm cache feeds this test job only; no image is built from it (the
      # Dockerfiles run their own `npm ci`). And `npm ci` checks every tarball
      # against the lockfile's integrity hash, so a tampered cache entry fails
      # the install rather than reaching the build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The version the images run (node:24-alpine). 20 is end-of-life,
          # and testing on one major while shipping another is how a runtime
          # difference reaches production unrehearsed.
          node-version: 24
          cache: npm # zizmor: ignore[cache-poisoning]
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # What ships, not what builds it: --omit=dev, because a ReDoS in a
      # linter never reaches a visitor. High and above fails; a moderate is
      # left to Dependabot and to the argument in the pull request that
      # accepted it. The image scan below catches the same packages again,
      # but only after a docker build - this says it in seconds, by name.
      - name: Runtime dependencies carry no high advisory
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report what shipped
        run: du -sh dist

  # The checks that drive a real Chromium against the built site, split off
  # Frontend, which they used to make a 13-14 minute job: the a11y sweep was
  # ~10 min of it (588-639 s, 8 runs on 2026-11-04) and the link landing
  # ~1.5 min (88-91 s). Both are a long list of independent page loads, so
  # they parallelise cleanly; the sweep is split round-robin over six legs
  # (SHARD=k/n, web/scripts/a11y/axe-routes.mjs) and the links get a leg of
  # their own. Together the legs run every route run the single step did, on
  # every pull request that touches web as well as on main: nothing is
  # sampled, so nothing regresses unseen between a PR and the next merge.
  #
  # Each leg builds the site itself rather than waiting for Frontend's dist:
  # `npm run build` is ~4 s, and an artifact handoff would put the legs
  # behind Frontend's lint, typecheck and tests (~1.6 min) for nothing. The
  # images are built by their Dockerfiles either way; this dist never ships.
  #
  # The browser comes from a cache, and apt runs only when a library is
  # missing (the install step says why: one run's apt took 22 minutes).
  #
  # Publish image needs this job, so main records no release manifest, and
  # a tag therefore promotes nothing, for a commit whose full sweep failed.
  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    needs: [classify]
    if: fromJSON(needs.classify.outputs.jobs).browser
    # Measured (runs 43579785095..43582865418): the longest legs are
    # admin-phone 2 (~5 min) and admin-matrix (~3.3 min); a11y and links are
    # ~2 min. Ten is 2x the longest and still stops a hung page well short
    # of the old 25. A leg near 5 min wants splitting, not a longer timeout.
    timeout-minutes: 10
    strategy:
      # Every leg reports, so one failing shard does not hide another's.
      fail-fast: false
      matrix:
        # `of` is the same on every a11y leg and `shard` runs 1..of; the
        # classifier's tests hold this list to that, so a leg cannot be
        # dropped without the sweep visibly shrinking.
        include:
          - { check: a11y, shard: 1, of: 6 }
          - { check: a11y, shard: 2, of: 6 }
          - { check: a11y, shard: 3, of: 6 }
          - { check: a11y, shard: 4, of: 6 }
          - { check: a11y, shard: 5, of: 6 }
          - { check: a11y, shard: 6, of: 6 }
          - { check: links, shard: 1, of: 1 }
          # The admin matrix (#660): overflow, targets and small text on every
          # admin screen at phone and tablet widths. Two legs split its
          # combinations (SHARD=k/n), the same way as the sweep above.
          - { check: admin-matrix, shard: 1, of: 2 }
          - { check: admin-matrix, shard: 2, of: 2 }
          # The phone-admin layout checks (#655 onward) used to ride on a11y
          # leg 1, which then ran ~10 min and hit its timeout (run
          # 43582865418, 2026-11-14). They are legs of their own, running in
          # parallel with the sweep: leg 1 is the layout, inbox, screens,
          # posts and editors scripts (~210 s), leg 2 is media, control
          # budgets, motion, reflow, sheets and typing (~260 s). A new phone
          # script goes on the shorter leg; keep each under ~5 min.
          - { check: admin-phone, shard: 1, of: 2 }
          - { check: admin-phone, shard: 2, of: 2 }
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.classify.outputs.sha || '' }}
      # Cache: same reasoning as Frontend's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm # zizmor: ignore[cache-poisoning]
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # `playwright-core` downloads no browser on install, so the build the
      # pin wants is fetched here - from a cache keyed on that exact version
      # when one exists.
      #
      # Why it is cached, and why apt is no longer run every time: the old
      # `install --with-deps` was 12-37 s on most runs, but on #332 (run
      # 41855490929, 2026-11-04) the same step took 22 min and the job hit
      # its 25-minute limit. The download is a fixed ~110 MB; the variance is
      # the apt half (`apt-get update` plus installs against the mirror). The
      # runner image already carries Chromium's libraries for its own Chrome,
      # so apt is now run only when `ldd` says the binary is missing one.
      #
      # The cached browser runs only against this job's test build; nothing
      # from this job is published. A pull request's cache entry is scoped
      # to its own ref, which main never reads.
      - name: Which browser build the pin wants
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ms-playwright
          key: pw-headless-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      # Bounded on its own, so a stalled mirror fails this leg in minutes
      # with the step named, rather than eating the job's budget.
      - name: Install the browser the checks drive
        timeout-minutes: 5
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail
          if [ "$HIT" != "true" ]; then
            npx playwright-core install chromium-headless-shell
          fi
          shell=$(find ~/.cache/ms-playwright -type f \( -name chrome-headless-shell -o -name headless_shell \) -perm -u+x | head -n 1)
          [ -n "$shell" ] || { echo "::error::no chrome-headless-shell under ~/.cache/ms-playwright"; exit 1; }
          missing=$(ldd "$shell" | awk '/not found/ { print $1 }')
          if [ -n "$missing" ]; then
            echo "::notice title=Browser libraries::the runner lacks $(echo "$missing" | tr '\n' ' ')- installing them with apt"
            npx playwright-core install-deps chromium-headless-shell
          fi
          "$shell" --version 2>/dev/null || true
          echo "browser: $shell (cache hit: ${HIT:-false})"
      # The accessibility floor (#99): axe-core over every public route, in
      # both reading directions and both themes (#247), at 1440px and at
      # 320px, against the build above. A floor and not the audit — the
      # manual half lives in docs/accessibility/audit.md — but it is the half
      # that can regress silently in a pull request, so it is the half CI
      # holds.
      - name: Accessibility floor (axe, WCAG 2.2 AA), shard ${{ matrix.shard }} of ${{ matrix.of }}
        if: matrix.check == 'a11y'
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: npm run a11y
      # The landing page's first screen on phones (mobile plan, PR 6): no
      # sideways overflow, the ask 24px clear of the bottom edge, 44px targets
      # in the dock and the hero, safe-area padding under an emulated notch,
      # in portrait and landscape, English and Hebrew, light and dark.
      - name: Landing first screen on a phone
        if: matrix.check == 'a11y' && matrix.shard == 5
        run: npm run a11y:public-landing
      # The Blog search box on a phone (#766): the field full width with its
      # icon inside, "#"/"@" on their own 44px row, no keyboard-only sentence
      # for touch, search keyboard hints, a 44px clear button, Hebrew mirrors.
      - name: Blog search box on a phone
        if: matrix.check == 'a11y' && matrix.shard == 6
        run: npm run a11y:public-blog-filter
      # Focus after navigation (#776): the heading holds focus for screen
      # readers, no ring after a tap, a 2px+ ring after a key (about 20 s).
      - name: Route-change focus ring
        if: matrix.check == 'a11y' && matrix.shard == 6
        run: npm run a11y:public-focus
      # Admin on a phone (#655): the projects list stays on screen, the draft
      # banner keeps its sentence, the small links are 44px. Layout, which axe
      # cannot see; leg 1 of 2.
      - name: Admin phone layout
        if: matrix.check == 'admin-phone' && matrix.shard == 1
        run: npm run a11y:admin-phones
      # The Marketing Inbox on a phone (#670): one tappable row per event,
      # at least 7 rows above the fold, no sideways scroll, the sheet opens
      # and gives focus back, Hebrew mirrors.
      - name: Admin Inbox on a phone
        if: matrix.check == 'admin-phone' && matrix.shard == 1
        run: npm run a11y:admin-inbox-phone
      # Overview, Connected apps, Translations and Settings on a phone
      # (#682): rows with one button and at most two facts, five setting
      # groups, the save history as compact rows, no sideways scroll.
      - name: Admin screens on a phone
        if: matrix.check == 'admin-phone' && matrix.shard == 1
        run: npm run a11y:admin-phone-screens
      # Posts and Areas on a phone (#680): one tappable row per record, at
      # least 7 post rows above the fold, no sideways scroll, Select shows
      # the bulk bar, the publish review is a sheet that leads with what
      # changes, Hebrew mirrors, and the desktop table is unchanged.
      - name: Admin Posts and Areas on a phone
        if: matrix.check == 'admin-phone' && matrix.shard == 1
        run: npm run a11y:admin-posts-phone
      # The content editors on a phone (#683): groups, one language, Reorder,
      # at most 4 viewport heights, no sideways scroll, desktop unchanged.
      - name: Admin editors on a phone
        if: matrix.check == 'admin-phone' && matrix.shard == 1
        run: npm run a11y:admin-editors-phone
      # The media library on a phone (#681): square tiles, 3 columns, at
      # least 6 tiles above the fold, no sideways scroll, the sheet puts the
      # alt text first and gives focus back, the desktop is unchanged.
      - name: Admin Media on a phone
        if: matrix.check == 'admin-phone' && matrix.shard == 2
        run: npm run a11y:admin-media-phone
      # Controls in the first screen of the editor, the review sheet, Audience,
      # Areas, the nav drawer and Library at 390x844, English and Hebrew: under
      # budget, no sideways scroll, focus returns, the desktop is unchanged.
      - name: Admin control budgets on a phone
        if: matrix.check == 'admin-phone' && matrix.shard == 2
        run: npm run a11y:admin-density-phone
      # Enter and exit motion on phones (#709): state first, transitions only
      # under no-preference, mirrored in RTL, never stuck, none on desktop.
      - name: Admin enter/exit motion
        if: matrix.check == 'admin-phone' && matrix.shard == 2
        run: npm run a11y:admin-motion
      # Reflow and device edge cases: the bulk bar at 320 and at 200% text, /story
      # headings at 320 and 280, Switch under forced-colors, 200% text at 320 and
      # 390, a landscape notch, Hebrew back arrows, heading levels.
      - name: Admin reflow and device edge cases
        if: matrix.check == 'admin-phone' && matrix.shard == 2
        run: npm run a11y:admin-reflow
      # Bottom sheets with real touch events (#715): a drag-dismissed sheet
      # reopens in the same place, a native close reaches the component, a
      # flick dismisses, one Back is never dead, focus never falls to body.
      - name: Bottom sheets on a phone
        if: matrix.check == 'admin-phone' && matrix.shard == 2
        run: npm run a11y:bottom-sheet-phone
      # Typing never throws the user out of a field: every text, email, url,
      # number and textarea in Marketing and site Settings is typed into with
      # awkward characters and Hebrew, at 390 and 1280; focus, value and the
      # expanders around the field must hold after every character.
      - name: Admin typing keeps focus and expanders
        if: matrix.check == 'admin-phone' && matrix.shard == 2
        run: npm run a11y:admin-typing
      # Admin at 320, 360, 390 and 768 wide, light and dark, English and
      # Hebrew (#660): no sideways scroll, no target under 24px, no primary
      # control under 44px on touch, no text under 14px outside the
      # allowlist, and every screen actually loads. Known findings live in
      # web/scripts/a11y/admin-matrix-baseline.json; a new one fails.
      - name: Admin viewport matrix, shard ${{ matrix.shard }} of ${{ matrix.of }}
        if: matrix.check == 'admin-matrix'
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: npm run a11y:admin-matrix
      # Admin at 1024, 1280 and 1440 wide, English and Hebrew (#747): no
      # sideways scroll, no button or link whose label wraps past two lines or
      # breaks a word per letter, on awkward long and Hebrew fixtures. About a
      # minute, so it rides one of the two matrix legs.
      - name: Admin desktop widths
        if: matrix.check == 'admin-matrix' && matrix.shard == 2
        run: npm run a11y:admin-desktop
      # Every link lands on its target (#196): the top of a new page, a hash's
      # element under the bar, the old place on Back and Forward, at a laptop
      # and a phone, against the same build.
      - name: Links land where they point
        if: matrix.check == 'links'
        run: npm run links

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [classify]
    if: fromJSON(needs.classify.outputs.jobs).backend
    # Measured: median ~0.4 min, slowest 1.7.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.classify.outputs.sha || '' }}
      # Cache: same reasoning as Frontend's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm # zizmor: ignore[cache-poisoning]
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Runtime dependencies carry no high advisory
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  # The MCP server (#252): a client of the API, not part of either image, so
  # it ships nothing and scans nothing. Its own job rather than steps of
  # Backend, so an mcp-only change does not build and scan the api image.
  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    needs: [classify]
    if: fromJSON(needs.classify.outputs.jobs).mcp
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.classify.outputs.sha || '' }}
      # Cache: same reasoning as Frontend's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm # zizmor: ignore[cache-poisoning]
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Runtime dependencies carry no high advisory
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # A gate, and the one place an image is built (#204).
  #
  # One candidate per component: built natively for linux/arm64 - the
  # cluster's only node is an Ampere A1 - on an arm64 runner, written to a
  # docker-archive, and scanned there. On main and tags that same archive is
  # handed to Publish image, which pushes it without building anything. So
  # the image that rolls out is the image Trivy judged, and Publish image
  # proves it in its log (.github/scripts/candidate.sh).
  #
  # Until #204 this job built a separate amd64 image to scan, and Publish
  # image built amd64 and arm64 again, arm64 under QEMU (~15 min on a cold
  # cache): the bytes that shipped had never been scanned, and the scanned
  # bytes never shipped. Nothing consumes amd64 (docs/ci-optimization-plan.md,
  # "After P3"), so it is no longer built.
  #
  # No packages:write here: a pull request builds and scans and stops. The
  # archive is uploaded only when classification selects Publish image,
  # which is main and v* tags.
  #
  # The policy is two calls rather than one, because Trivy's single
  # `ignore-unfixed` switch cannot say it:
  #   - CRITICAL fails whether or not a fix exists. An unfixable CRITICAL is
  #     a decision for a person, made in .trivyignore.yaml with a reason and
  #     an expiry - not something the pipeline waves through on its own.
  #   - HIGH fails only once upstream has shipped a fix. Before then there is
  #     nothing to upgrade to, and failing would teach everyone to ignore red.
  # Both read the same ignore file, so an accepted finding is accepted once.
  # A scanner or vulnerability-database error exits non-zero as well, so it
  # fails the leg rather than reading as a clean scan.
  scan:
    name: Scan image
    runs-on: ubuntu-24.04-arm
    # Was `needs: [dockerfiles]`: a Dockerfile that fails lint is not built.
    needs: [static, classify]
    # A leg per selected image: `[{image: web, context: web}, ...]`, the same
    # keys as before, so a leg keeps its check name ("Scan image (web, web)").
    # An empty matrix is an error rather than a skip, hence the `if`.
    if: fromJSON(needs.classify.outputs.jobs).scan
    # A cold layer cache rebuilds the image from scratch and Trivy may fetch
    # its database. Native, so no emulation multiplier.
    timeout-minutes: 20
    permissions:
      contents: read
    # Per image, because a matrix's legs share one set of job outputs: the
    # web leg sets web_*, the api leg api_*, and neither overwrites the other.
    outputs:
      web_id: ${{ steps.candidate.outputs.web_id }}
      web_sha256: ${{ steps.candidate.outputs.web_sha256 }}
      api_id: ${{ steps.candidate.outputs.api_id }}
      api_sha256: ${{ steps.candidate.outputs.api_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.scan_matrix) }}
    env:
      PLATFORM: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name != 'pull_request' && needs.classify.outputs.sha || '' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          platforms: ${{ env.PLATFORM }}
          # A docker-archive on disk: Trivy reads it, and Publish image loads
          # and pushes it. Named as Deploy will set it.
          outputs: type=docker,dest=${{ runner.temp }}/candidate.tar
          # The sha only. `latest` used to move on every merge, and `:latest`
          # is what oci-free's portfolio-apply.sh creates a missing Deployment
          # with - so a rebuild between releases would have deployed
          # unreleased code without anybody choosing to. `latest` is written
          # by Publish image on a tag, and means the last release.
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ needs.classify.outputs.sha }}
          # The commit, baked in so a running pod can say which build it is:
          # the api on /health, web in <meta name="build-sha">. The Deploy
          # job asserts on both after a rollout (#200).
          build-args: BUILD_SHA=${{ needs.classify.outputs.sha }}
          # The layer cache, one scope per component and platform. A pull
          # request's writes land in its own ref's cache, which main never
          # reads; a miss costs time, never a step.
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,scope=${{ matrix.image }}-arm64,mode=max

      # The identity the scan vouches for: the image ID (its config digest)
      # and the archive's sha256, checked for the right platform and printed.
      - name: What was built
        id: candidate
        env:
          PREFIX: ${{ matrix.image }}
          CANDIDATE: ${{ runner.temp }}/candidate.tar
        run: .github/scripts/candidate.sh describe "$CANDIDATE"

      # Pinned to a commit, not the tag: trivy-action's tags were rewritten to
      # malicious commits in March 2026, and a tag is only a name somebody can
      # move. Dependabot updates a sha pin and keeps the version comment.
      - name: CRITICAL, fixed or not
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/candidate.tar
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      # Every input restated rather than left to defaults, so neither call's
      # policy depends on what the other one set up in this job.
      - name: HIGH, where a fix exists
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/candidate.tar
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          skip-setup-trivy: true

      # The SBOM Publish image attests to the pushed digest (#206): every
      # package in the archive that was just scanned, as CycloneDX, by the
      # same trivy. Packages only, no vulnerabilities: those change daily,
      # and the release manifest and the scheduled rescan carry them. Made
      # on pull requests too, where nothing is attested, so a broken SBOM is
      # found before main depends on it; seconds, from the local archive.
      - name: SBOM of the scanned candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/candidate.tar
          format: cyclonedx
          output: ${{ runner.temp }}/sbom.cdx.json
          exit-code: "0"
          skip-setup-trivy: true
      - name: The SBOM lists the image's packages
        env:
          SBOM: ${{ runner.temp }}/sbom.cdx.json
        run: |
          set -Eeuo pipefail
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$SBOM" >/dev/null ||
            { echo "::error title=Empty SBOM::$SBOM is not a CycloneDX document listing components"; exit 1; }
          jq -r '"SBOM: CycloneDX \(.specVersion), \(.components | length) components"' "$SBOM"

      # Only once both scans passed (the implicit `success()`), and only for
      # a run that publishes. A day is plenty: Publish image runs minutes
      # later, and a redeploy uses the registry, never this artifact.
      - name: Hand the scanned candidate to Publish image
        if: fromJSON(needs.classify.outputs.jobs).images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/candidate.tar
            ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 1
          # The layers are gzip already; zipping them again is time for nothing.
          compression-level: 0

      # The scan's half of the release manifest (#205): the effective build
      # inputs (the context's git tree, Dockerfile, lockfile, base image
      # digests, build argument), the tool versions, and the scan result with
      # the vulnerability database's timestamp, plus the findings as JSON
      # from the same database. Release manifest joins it to the pushed
      # digest. Same condition as the upload above.
      - name: Record what was built and what the scan saw
        if: fromJSON(needs.classify.outputs.jobs).images
        env:
          SOURCE_SHA: ${{ needs.classify.outputs.sha }}
          CANDIDATE: ${{ runner.temp }}/candidate.tar
          IMAGE_ID: ${{ steps.candidate.outputs[format('{0}_id', matrix.image)] }}
          ARCHIVE_SHA256: ${{ steps.candidate.outputs[format('{0}_sha256', matrix.image)] }}
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
        run: .github/scripts/release.sh evidence "$IMAGE" "$CONTEXT"
      - name: Hand the evidence to Release manifest
        if: fromJSON(needs.classify.outputs.jobs).images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.image }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 1

  # A skipped matrix job never expands its matrix, so an interpolated job name
  # is reported verbatim. A static name lets Actions append the leg itself -
  # "Publish image (web)" when it runs, "Publish image" when it does not.
  #
  # Pushes the archive Scan image built and scanned, and builds nothing
  # (#204). It needs the tests as well as the scan, so nothing is published
  # for a commit whose tests failed, and it is the only job that holds
  # packages:write.
  images:
    name: Publish image
    runs-on: ubuntu-24.04-arm
    needs: [classify, static, frontend, browser, backend, scan]
    # A download, a load and a push of one image.
    timeout-minutes: 15
    # Main (and a rebuild from a tag), so every main commit is deployable the
    # moment it is tagged. A plain tag push publishes nothing (#205): it
    # promotes the digests main already published.
    #
    # Both images, every time: Deploy sets web AND api from the manifest, so
    # an api-only merge still needs a web image. Reusing an unchanged image's
    # digest needs a dependency-aware proof that its inputs are identical,
    # and #205 left that out.
    if: fromJSON(needs.classify.outputs.jobs).images
    permissions:
      contents: read
      packages: write
      # Attestations (#206): an OIDC token for Sigstore's signing
      # certificate, and the right to record the attestation. This job and
      # Release manifest only; nothing that runs on a pull request has them.
      id-token: write
      attestations: write
    # Per image, as Scan image's are: the pushed manifest digest, which is
    # what Release manifest records and Deploy rolls out.
    outputs:
      web_digest: ${{ steps.push.outputs.web_digest }}
      api_digest: ${{ steps.push.outputs.api_digest }}
    strategy:
      fail-fast: false
      matrix:
        image: [web, api]
    env:
      PLATFORM: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # From this run only (the default run-id), and checked against the
      # digest recorded at upload (`digest-mismatch` defaults to error).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ matrix.image }}
          path: ${{ runner.temp }}/candidate
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The archive must hash to what the scan recorded, and after the push
      # the registry's manifest must carry the image ID the scan saw. Both
      # IDs and the pushed digest are printed; a mismatch fails here, before
      # Deploy can roll anything out.
      - name: Push the scanned candidate, and prove it is what was scanned
        id: push
        env:
          EXPECT_ID: ${{ needs.scan.outputs[format('{0}_id', matrix.image)] }}
          EXPECT_SHA256: ${{ needs.scan.outputs[format('{0}_sha256', matrix.image)] }}
          CANDIDATE: ${{ runner.temp }}/candidate/candidate.tar
          REF: ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ needs.classify.outputs.sha }}
          PREFIX: ${{ matrix.image }}
        run: .github/scripts/candidate.sh publish "$CANDIDATE" "$REF"

      # Provenance and SBOM, signed with this run's OIDC identity and bound
      # to the digest just pushed (#206). Both are stored in GitHub's
      # attestation API and pushed to GHCR next to the image. Verify with:
      #
      #   gh attestation verify oci://ghcr.io/yehudabriskman/portfolio_site/web@sha256:<digest> \
      #     --repo YehudaBriskman/portfolio_site
      #   gh attestation verify oci://... --repo YehudaBriskman/portfolio_site \
      #     --predicate-type https://cyclonedx.org/bom
      #
      # actions/attest does both: attest-build-provenance and attest-sbom
      # are thin wrappers over it, and attest-sbom is deprecated in its favour.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs[format('{0}_digest', matrix.image)] }}
          push-to-registry: true
          # Storage records exist for organisation-owned repositories only;
          # this one is a user's, and would need artifact-metadata: write.
          create-storage-record: false
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs[format('{0}_digest', matrix.image)] }}
          sbom-path: ${{ runner.temp }}/candidate/sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

  # ------------------------------------------------------- release manifest --
  #
  # What this commit's release IS, written once and kept (#205): the source
  # sha; each image by digest (`ghcr.io/...@sha256:`) with its image ID; the
  # build inputs (context tree, Dockerfile, lockfile, base image digests);
  # tool versions; the platform; the scan result and the vulnerability DB's
  # timestamp; and this run's id and attempt. Stored in GHCR as an OCI
  # artifact, `<IMAGE_BASE>/manifest:<sha>`, next to the images, because a
  # redeploy or a tag next month must not depend on a run artifact that
  # expires in days. The run artifact uploaded below is a convenience for
  # reading it in the browser; nothing reads it back.
  #
  # Deploy (preprod now, prod on a tag) reads the manifest from GHCR, by the
  # digest this job reports, and rolls out the digests it names.
  release:
    name: Release manifest
    runs-on: ubuntu-latest
    needs: [classify, scan, images]
    if: fromJSON(needs.classify.outputs.jobs).release
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Provenance for the manifest itself (#206), as Publish image has for
      # the images: the record of a release is as worth forging as an image.
      id-token: write
      attestations: write
    outputs:
      manifest_digest: ${{ steps.push.outputs.manifest_digest }}
    env:
      PLATFORM: linux/arm64
      SOURCE_SHA: ${{ needs.classify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # From this run only, checked against the digest recorded at upload.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Install oras
        run: .github/scripts/release.sh install-oras
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the manifest
        env:
          WEB_DIGEST: ${{ needs.images.outputs.web_digest }}
          API_DIGEST: ${{ needs.images.outputs.api_digest }}
        run: .github/scripts/release.sh assemble "$RUNNER_TEMP/release"
      # Pushed, then read back by digest and compared byte for byte.
      - name: Store it in GHCR
        id: push
        run: .github/scripts/release.sh push "$RUNNER_TEMP/release"
      # Signed with this run's identity and bound to the digest Deploy reads:
      #   gh attestation verify oci://ghcr.io/yehudabriskman/portfolio_site/manifest@sha256:<digest> \
      #     --repo YehudaBriskman/portfolio_site
      - name: Attest the manifest's provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/manifest
          subject-digest: ${{ steps.push.outputs.manifest_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: A copy to read in the browser (not the record)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release/manifest.json
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------- promote release --
  #
  # A v* tag, and the only path to prod (#205). Builds nothing. In order:
  #
  #   1. The commit: classification resolved the tag to one commit, once.
  #      It must be on main.
  #   2. The manifest main CI recorded for exactly that commit, from GHCR,
  #      by digest. Missing, for another commit, or not a release manifest:
  #      the release stops, saying so.
  #   3. The run it names: this repository's CI, on main, for that commit,
  #      and in that attempt Static, Frontend, Backend, both Scan legs, both
  #      Publish legs and Release manifest all passed. (A rebuild instead
  #      requires the manifest this run just wrote.)
  #   4. Those digests re-scanned against today's vulnerability database,
  #      with the same policy: an advisory published since main scanned them
  #      stops the release.
  #   5. The tag's name on the images and on the manifest, as aliases of the
  #      digests (`imagetools create`, `oras tag`), never a rebuild.
  #
  # The one way past a missing manifest is a manual run from the tag with
  # `rebuild: true`, which runs every build, test and scan job first.
  promote:
    name: Promote release
    runs-on: ubuntu-latest
    needs: [classify, static, release]
    if: >-
      !cancelled()
      && fromJSON(needs.classify.outputs.jobs).promote
      && needs.static.result == 'success'
      && needs.release.result == (fromJSON(needs.classify.outputs.jobs).release && 'success' || 'skipped')
    # Two remote image scans and a few registry calls.
    timeout-minutes: 20
    permissions:
      contents: read
      # The tag's name on the images and the manifest.
      packages: write
      # To ask GitHub about the run the manifest names.
      actions: read
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.manifest_digest }}
    env:
      PLATFORM: linux/arm64
      SOURCE_SHA: ${{ needs.classify.outputs.sha }}
    steps:
      # Full history: whether the commit is on main is a git question.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install oras
        run: .github/scripts/release.sh install-oras
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The tag's commit is on main
        run: .github/scripts/release.sh on-main "$SOURCE_SHA"
      - name: Main recorded a release for this commit
        id: manifest
        env:
          # Empty on a tag push; on a rebuild, what Release manifest wrote.
          EXPECT_MANIFEST_DIGEST: ${{ needs.release.outputs.manifest_digest }}
        run: .github/scripts/release.sh fetch "$SOURCE_SHA" "$RUNNER_TEMP/release"
      - name: It came from a passing main CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_RUN_ID: ${{ fromJSON(needs.classify.outputs.jobs).release && github.run_id || '' }}
        run: .github/scripts/release.sh origin "$RUNNER_TEMP/release/manifest.json"

      # The policy Scan image applies, on the registry's bytes, today.
      - name: web, CRITICAL, fixed or not (today's DB)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.web_image }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - name: web, HIGH where a fix exists (today's DB)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.web_image }}
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          skip-setup-trivy: true
      - name: api, CRITICAL, fixed or not (today's DB)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.api_image }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          skip-setup-trivy: true
      - name: api, HIGH where a fix exists (today's DB)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.api_image }}
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          skip-setup-trivy: true
      - name: Which database the re-scan used
        if: success() || failure()
        run: |
          set -uo pipefail
          t=$(command -v trivy || echo "$HOME/.local/bin/trivy-bin/trivy")
          db=$("$t" version --format json --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" | jq -c .VulnerabilityDB)
          echo "re-scanned with $db"
          echo "Re-scanned against vulnerability DB \`$db\`" >>"$GITHUB_STEP_SUMMARY"

      # Aliases, not rebuilds: new names for the digests main published.
      # `:latest` moves only once prod is running the release (Deploy).
      #
      # The tag name reaches the shell through env, not `${{ }}` inside the
      # script: a ref name is text somebody typed, and pasted into a script
      # it would be run as part of it.
      - name: Name the release
        env:
          RELEASE: ${{ github.ref_name }}
          WEB_IMAGE: ${{ steps.manifest.outputs.web_image }}
          API_IMAGE: ${{ steps.manifest.outputs.api_image }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE_BASE/web:$RELEASE" "$WEB_IMAGE"
          docker buildx imagetools create --tag "$IMAGE_BASE/api:$RELEASE" "$API_IMAGE"
          oras tag "$IMAGE_BASE/manifest@$MANIFEST_DIGEST" "$RELEASE"

  # ----------------------------------------------------------------- deploy --
  #
  # The rollout, from a known commit, to one of two environments.
  #
  # A tag rolls out to `prod`; a push to `main` rolls out to `preprod`, which
  # is the same two Deployments in their own namespace on their own host, so
  # merged work can be looked at before anybody decides to release it.
  #
  # ONE job rather than two, and the ternaries at the top are the price of it.
  # The valuable part of this job is not `set image` — it is the preflight that
  # refuses to start a rollout the cluster cannot finish, the group that says
  # *why* a rollout stalled, the curl that distinguishes "rollout succeeded"
  # from "site answers", and the undo. Those are the things preprod most needs,
  # because preprod is where a bad build should be caught. Copied into a second
  # job they would be ~80 duplicated lines, and the first one to be fixed in
  # only one place turns preprod into an environment that tests a pipeline
  # nobody runs. Three expressions in one place is the cheaper duplication.
  #
  # The matrix alternative was rejected for a different reason: a matrix would
  # expand to both legs and need `if` on every step, and the two legs are
  # mutually exclusive — one ref is never both a tag and a branch.
  #
  # What this replaces: `deploy-portfolio.sh` in the oci-free repository, which
  # rsynced a laptop's WORKING DIRECTORY to the node, built there, and imported
  # into containerd. The live site could therefore be running code that was
  # never committed, and for six weeks it was. It had also quietly stopped
  # working altogether -- the script still synced a frontend directory that had
  # been renamed, rsync failed on the missing path, `set -e` aborted the run,
  # and nothing reported that the site had stopped updating.
  #
  # The cluster's API server is not reachable from the internet, by design:
  # SSH and the Kubernetes API both go over Tailscale and neither is exposed.
  # So the runner joins the tailnet for the length of the job with an ephemeral
  # node, rather than the alternative, which is opening the API to the world so
  # that a CI runner can talk to it.
  #
  # `set image` to the digests the release manifest names (#205), not
  # `rollout restart` against :latest and no longer the commit-sha tag. A
  # restart against a moving tag redeploys whatever that tag points at now,
  # which is not necessarily this commit and is not reproducible; a digest
  # cannot move at all, and it is the exact image that was scanned.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Measured median ~0.6 min, slowest 1.9. The worst case it is written for
    # is longer: a minute for a path to the node, a 300s rollout wait per
    # Deployment, then a 180s undo per Deployment - about twenty minutes.
    timeout-minutes: 30
    # Main: once Release manifest has stored the manifest. A tag (or a
    # rebuild from one): once Promote release has vetted it.
    needs: [classify, release, promote]
    if: >-
      !cancelled()
      && fromJSON(needs.classify.outputs.jobs).deploy
      && ((fromJSON(needs.classify.outputs.jobs).promote && needs.promote.result == 'success')
        || (!fromJSON(needs.classify.outputs.jobs).promote && needs.release.result == 'success'))
    # One rollout at a time per environment. Two merges in quick succession
    # would otherwise race. Per environment rather than globally: a tag and a
    # merge touch different namespaces and have no reason to queue behind each
    # other.
    #
    # The lock is not the ordering (#205): runs take it in whatever order
    # they reach it, and a re-run takes it days later. So the first thing
    # done inside it is `deploy.sh guard`, which asks again whether this is
    # still the release to roll out.
    concurrency:
      group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'preprod' }}
      cancel-in-progress: false
    # Each environment holds its own cluster credential (#16): KUBECONFIG_PROD
    # only on `production`, KUBECONFIG_PREPROD only on `preprod`, each a token
    # that can roll out its own namespace and nothing else. Until then one
    # repository secret carried a token for both, so every merge to main
    # decrypted the prod credential and a reviewer here would have gated
    # nothing. The environments' branch policies (`production`: v* tags,
    # `preprod`: main) are what keep another ref from declaring the
    # environment and reading its secret; oci-free's README has the commands.
    #
    # `production` is also where a required reviewer goes if a human step
    # before a live rollout is ever wanted; `preprod` deliberately has none,
    # since being able to look at `main` without asking is the point.
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preprod' }}
      url: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://yehudabriskman.com/' || 'https://preprod.yehudabriskman.com/' }}
    permissions:
      contents: read
      # Reading the release manifest, and moving `:latest` once prod runs
      # the release.
      packages: write
    # What differs between the two environments, resolved once here so no step
    # below has to ask which one it is in. The third difference — what the
    # rollout is called — is computed in the rollout step itself, because
    # workflow expressions cannot take a substring of a sha.
    env:
      DEPLOY_NS: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'preprod' }}
      DEPLOY_URL: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://yehudabriskman.com/' || 'https://preprod.yehudabriskman.com/' }}
      # What a healthy answer looks like, and it differs by environment.
      #
      # Prod is public and must return 200. Preprod is behind a forwardAuth
      # gate, so the healthy answer to an unauthenticated request — which is
      # all CI can make — is a 302 to the identity provider. Asserting 200
      # there is asserting the gate is broken, and this check did exactly
      # that: the first green rollout to preprod was undone by its own health
      # check, which is the correct behaviour applied to the wrong premise.
      #
      # Not "any 2xx or 3xx": a redirect loop and a gate look identical under
      # that rule, and the whole point of this step is to disbelieve the
      # rollout. One expected code per environment.
      DEPLOY_EXPECT: ${{ startsWith(github.ref, 'refs/tags/v') && '200' || '302' }}
      # The commit .github/scripts/deploy.sh asks the pods for, and the one
      # whose release manifest it rolls out. Resolved once, by classify.
      DEPLOY_SHA: ${{ needs.classify.outputs.sha }}
      DEPLOY_REF_NAME: ${{ github.ref_name }}
      # The manifest digest the job before this one wrote or vetted; Deploy
      # refuses a manifest:<sha> that has changed since.
      EXPECT_MANIFEST_DIGEST: ${{ needs.promote.outputs.manifest_digest || needs.release.outputs.manifest_digest }}
      PLATFORM: linux/arm64
    steps:
      # For the scripts, and full history for the guard's questions about
      # main. Nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Ephemeral, so the runner leaves no device behind in the tailnet
          # when the job ends.
          version: 1.104.6

      # Through the environment, not interpolated into the script. A secret
      # expanded by the workflow templater becomes part of the command line,
      # where `set -x`, a shell error or anything that echoes the command can
      # print it; base64 so the embedded newlines survive the round trip
      # without depending on how the value was pasted into the secret.
      # The tailnet is up before this step, but a path to a specific peer is
      # not: Tailscale builds one lazily, and the first packet is what builds
      # it. The first real rollout joined the tailnet successfully and then
      # timed out on the API server sixty-four seconds later, because kubectl
      # was the thing discovering the route and kubectl does not retry.
      #
      # So: ping to force path discovery, then poll the port until it answers.
      # A minute is generous for a relay to come up and still finishes long
      # before kubectl's own 32-second-per-call timeout becomes the clock.
      - name: Wait for a path to the node
        # The node's tailnet address lives in a secret rather than in this
        # file because the repository is public. It is only reachable from
        # inside the tailnet, but there is no reason to publish it.
        env:
          NODE_IP: ${{ secrets.TAILNET_NODE_IP }}
        run: |
          set -uo pipefail
          if [ -z "$NODE_IP" ]; then
            echo "::error title=TAILNET_NODE_IP is not set::Add the cluster node's tailnet address as the repository secret TAILNET_NODE_IP."
            exit 1
          fi
          tailscale status --peers=false || true
          tailscale ping --timeout=5s -c 3 "$NODE_IP" || true
          for i in $(seq 1 20); do
            if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/$NODE_IP/6443' 2>/dev/null; then
              echo "API server answered after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error title=No path to the API server::Joined the tailnet but $NODE_IP:6443 never answered in 60s. A timeout is a dropped packet rather than a refused connection, so look at the tailnet before the cluster: is the ephemeral node listed below, and does the policy permit its tag to reach that port?"
          tailscale status || true
          tailscale netcheck || true
          exit 1

      # Both names are passed and the shell picks by namespace, rather than one
      # `cond && secrets.A || secrets.B` expression: that falls through to B
      # whenever A is empty, which is how a prod job would end up holding the
      # preprod token, or the reverse, without anything saying so.
      - name: Point kubectl at the cluster
        env:
          KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}
          KUBECONFIG_PREPROD: ${{ secrets.KUBECONFIG_PREPROD }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_NS" = prod ]; then
            name=KUBECONFIG_PROD; value=$KUBECONFIG_PROD; env_name=production
          else
            name=KUBECONFIG_PREPROD; value=$KUBECONFIG_PREPROD; env_name=preprod
            # Visible here means it is a repository secret, i.e. readable by
            # every job on every ref, which is the thing #16 removed.
            if [ -n "$KUBECONFIG_PROD" ]; then
              echo "::error title=KUBECONFIG_PROD is visible outside production::The preprod job can read KUBECONFIG_PROD, so it is a repository secret rather than a secret of the production environment. Delete it with: gh secret delete KUBECONFIG_PROD, and set it again with --env production."
              exit 1
            fi
          fi
          if [ -z "$value" ]; then
            echo "::error title=$name is not set::This job runs in the $env_name environment and needs its own cluster credential (#16). From the oci-free repository: ./k8s/ci-kubeconfig.sh $DEPLOY_NS | gh secret set $name --env $env_name. README.md there, 'Retiring the shared token', has the full order."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$value" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          # The kubeconfig's context is this environment's namespace, and
          # every call passes -n anyway. The RBAC behind it grants, in this
          # namespace only: get/patch/watch on the web and api Deployments,
          # read on pods and ReplicaSets, and GET through the service proxy
          # to api:5000 and web:80 for the readiness check
          # (k8s/ci-rollout-rbac.yaml in oci-free). `patch` there is the whole
          # pod template, which is why the token stays in its environment.
          if ! kubectl -n "$DEPLOY_NS" get deploy web api -o name; then
            echo "::error title=Nothing to roll out in $DEPLOY_NS::Either the namespace has not been set up yet or this environment's token is not bound in it. For a first preprod rollout, from the oci-free repository: ./k8s/portfolio-apply.sh preprod && kubectl apply -f k8s/tailnet-only-middleware.yaml -f k8s/ci-rollout-rbac.yaml && ./k8s/preprod-secrets.sh"
            exit 1
          fi

      # The manifest lives in another repository, and merging it there does
      # nothing to the cluster until somebody runs `kubectl apply`. Nothing
      # reports that gap, and it cost this pipeline its first green rollout:
      # the deployments still carried `imagePullPolicy: Never` from the old
      # build-on-the-node arrangement, `set image` changed the tag but not the
      # policy, and both new pods sat in ErrImageNeverPull until the five
      # minute rollout timeout gave up and undid the whole thing.
      #
      # Two seconds of assertion in exchange for that. It cannot apply the
      # manifest — that repository is not checked out here, and reaching for
      # it would mean another credential — but it can refuse to start a
      # rollout the cluster is not configured to complete, and say which
      # command closes the gap.
      #
      # It runs for preprod too, where the same drift is likelier rather than
      # less: preprod is applied by hand once and then left for weeks.
      - name: The cluster can actually pull
        run: |
          set -euo pipefail
          bad=0
          for d in web api; do
            policy=$(kubectl -n "$DEPLOY_NS" get deploy "$d" \
              -o jsonpath='{.spec.template.spec.containers[0].imagePullPolicy}')
            secrets=$(kubectl -n "$DEPLOY_NS" get deploy "$d" \
              -o jsonpath='{.spec.template.spec.imagePullSecrets[*].name}')
            echo "$d: imagePullPolicy=$policy imagePullSecrets=[${secrets:-none}]"
            [ "$policy" = "Never" ] && { echo "  ^ cannot pull from a registry"; bad=1; }
            case " $secrets " in *" ghcr-pull "*) ;; *) echo "  ^ no ghcr-pull secret"; bad=1;; esac
          done
          if [ "$bad" = 1 ]; then
            manifest=$([ "$DEPLOY_NS" = prod ] && echo k8s/portfolio.yaml || echo k8s/portfolio-preprod.yaml)
            echo "::error title=The cluster has drifted from its manifest::The live Deployments in $DEPLOY_NS are not configured to pull from GHCR, so this rollout would stall in ErrImageNeverPull. Apply the manifest from the oci-free repository first: kubectl apply -f $manifest"
            exit 1
          fi

      # The release manifest for this commit, from GHCR (#205): never a run
      # artifact, which may have expired. By the digest the job before wrote
      # or vetted, and validated again: this commit, these two repositories,
      # digests only. Its two image digests are all that is rolled out.
      - name: Install oras
        run: .github/scripts/release.sh install-oras
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the release manifest
        id: manifest
        run: .github/scripts/release.sh fetch "$DEPLOY_SHA" "$RUNNER_TEMP/release"

      # Inside the deploy lock, before anything changes: is this still the
      # release to roll out? Preprod skips (green, with a notice) when a newer
      # main commit already has a manifest. Prod refuses a release older than
      # the running one unless this run was started with `rollback: true`.
      # Every step that touches the cluster below checks `proceed`.
      - name: Is this still the release to roll out
        id: guard
        env:
          ROLLBACK: ${{ inputs.rollback }}
        run: .github/scripts/deploy.sh guard

      # The in-cluster readiness check below needs GET through the service
      # proxy to api:5000 and web:80 (#24), and this credential must not be
      # able to roll out the other namespace (#16). Asked now, while nothing
      # has been changed, so a wrong grant or a wrong secret fails a deploy
      # that has nothing to undo.
      - name: CI may reach the pods
        if: steps.guard.outputs.proceed == 'true'
        run: .github/scripts/deploy.sh preflight

      # The way back, written down before the first patch (#199): both
      # Deployments' exact images, digest-pinned where they are. A recovery
      # sets these strings back rather than `rollout undo`, which goes to the
      # previous ReplicaSet — and after a half-finished rollout, or for a
      # Deployment the failed run never reached, that is not what was running.
      - name: Record what is running
        id: record
        if: steps.guard.outputs.proceed == 'true'
        run: .github/scripts/deploy.sh record

      # Both environments roll out the manifest's digests. Preprod does NOT
      # roll out `:latest` and does not write it: `:latest` means the last
      # release, and it means that because it is what oci-free's
      # portfolio-apply.sh creates a missing Deployment with. A preprod that
      # moved `:latest` on every merge would put unreleased code behind a
      # production rebuild, which is the exact failure the tag split was
      # introduced to remove.
      #
      # `set image` to the digests, the annotations (version, released-at,
      # source-sha), and `rollout status` with the reason a stuck rollout is
      # stuck all live in deploy.sh. It marks the environment as changed
      # before the first patch, so a failure anywhere after that point — the
      # second patch, the wait, either check below — puts both Deployments
      # back, not only the case where the rollout itself finished.
      - name: Roll out this release
        id: rollout
        if: steps.guard.outputs.proceed == 'true'
        env:
          DEPLOY_WEB_IMAGE: ${{ steps.manifest.outputs.web_image }}
          DEPLOY_API_IMAGE: ${{ steps.manifest.outputs.api_image }}
        run: .github/scripts/deploy.sh rollout

      # Inside the cluster, past Traefik and the forwardAuth gate (#200). The
      # boundary check below can only see the gate on preprod — a 302 says
      # forwardAuth answered and nothing about the app — so this is where the
      # app is asserted: both Deployments and every pod run the manifest's
      # digests (the kubelet's imageID, #205), api /health/ready says the
      # store is up, web's root is the real document by its bytes, and both
      # report this commit's sha. Through the API server's service proxy to
      # the api and web Services (#24), which the CI Role allows for those
      # two names and GET only; it replaced a port-forward that could reach
      # any pod in the namespace.
      - name: The pods are this build, and ready
        if: steps.guard.outputs.proceed == 'true'
        env:
          DEPLOY_WEB_IMAGE: ${{ steps.manifest.outputs.web_image }}
          DEPLOY_API_IMAGE: ${{ steps.manifest.outputs.api_image }}
        run: .github/scripts/deploy.sh readiness

      # A rollout that reports success and a site that does not answer are
      # different things, and only one of them is what was wanted.
      #
      # The public URL, on both `/` and a real API route, each by its status
      # AND its body (#155). v1.0.0 went green here while every /api/ request
      # answered 502, because this step asked only for `/`, and nginx serves
      # `/` (the SPA shell, with a 200) whether or not it can reach the api.
      # Prod must answer the document and the posts list as JSON. Preprod's
      # gate covers the whole host, so there both must be its 302; what is
      # behind the gate, /api/ through nginx included, is asserted by the
      # in-cluster step above. A failure here puts both Deployments back.
      #
      # The preprod host is tailnet-only — a Traefik ipAllowList on
      # 100.64.0.0/10, and its DNS record points at the node's tailnet
      # address. This check therefore only passes because the runner is still
      # on the tailnet from the first step, which also means a 403 here is a
      # statement about the tailnet rather than about the build. Said out loud
      # in the failure message, because it is not a guess anybody should have
      # to make twice.
      - name: Check the site actually answers
        if: steps.guard.outputs.proceed == 'true'
        run: .github/scripts/deploy.sh edge

      # Only once something was recorded, and deploy.sh acts only if the
      # environment was actually changed. Unreachable cluster means there is
      # nothing to undo, and more kubectl calls against an API that is not
      # answering is minutes more of the same timeout.
      #
      # On a cancel as well as a failure: a run cancelled between the two
      # patches leaves the namespace half-changed exactly as a failure does.
      # A recovery that does not come back healthy is its own ::error, so it
      # is not read as the original failure repeating itself.
      - name: Put it back if it did not
        if: (failure() || cancelled()) && steps.record.outcome == 'success'
        run: .github/scripts/deploy.sh recover

      # `:latest` is the last release prod actually runs, which is what
      # oci-free's portfolio-apply.sh creates a missing Deployment with. So it
      # moves here, after the rollout and both checks passed, and never in
      # Promote release: a release the guard refused must not become `:latest`.
      - name: Name it the latest release
        if: steps.guard.outputs.proceed == 'true' && env.DEPLOY_NS == 'prod'
        env:
          WEB_IMAGE: ${{ steps.manifest.outputs.web_image }}
          API_IMAGE: ${{ steps.manifest.outputs.api_image }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE_BASE/web:latest" "$WEB_IMAGE"
          docker buildx imagetools create --tag "$IMAGE_BASE/api:latest" "$API_IMAGE"

  # ------------------------------------------------------------------- gate --
  #
  # The one required check (#203). Frontend, Backend and the Scan legs skip
  # when classification does not select them, and a skipped job cannot be a
  # required check: it either never reports under its name, and the merge
  # waits forever, or it reports "skipped", which a ruleset reads as a pass
  # whether or not the skip was meant. So the ruleset requires this instead,
  # and this asks the question properly (.github/scripts/ci-gate.mjs, tested
  # in Static): classification succeeded, every selected job succeeded, and
  # every skip is one classification asked for. Failure, cancellation or an
  # unexplained skip fails it.
  #
  # `always()`, not `!cancelled()`: a gate that is skipped when the run is
  # cancelled would be a skipped required check, which passes.
  #
  # It needs every job, Publish image and Deploy included, so on main it is
  # green only once the rollout is. Static's tests hold `needs` equal to the
  # jobs classification selects; a new job has to be added to both.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [classify, static, frontend, browser, backend, mcp, scan, images, release, promote, deploy]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Every selected job passed, every skip was selected
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.mjs
