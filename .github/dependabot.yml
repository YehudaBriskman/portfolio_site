# Dependabot: the part of #122 that keeps it fixed.
#
# POLICY - at most three open Dependabot pull requests, ever: one per ecosystem.
#
#   npm             /web, /backend and /mcp together, every update type, one PR
#   docker          every Dockerfile directory, every update type, one PR
#   github-actions  every workflow, every update type, one PR
#
# Each entry has ONE group matching every dependency and every update type
# (major, minor, patch), and `open-pull-requests-limit: 1`. A newer version
# does not open a second PR beside the first: Dependabot rebuilds the open
# group PR in place. What grouping cannot catch (a security update, which
# opens outside any group, or a PR left over from an older config) is closed
# by .github/workflows/dependabot-supersede.yml, which closes any older open
# Dependabot PR for the same ecosystem when a new one opens.
#
# The price of one PR per ecosystem: a major that breaks the build holds back
# everything else in that PR. That is what `ignore` is for - a major we have
# decided not to take yet goes there, with when to revisit it, and the rest
# keep flowing. Do not let a red group PR sit; move the culprit into `ignore`.
#
# Security updates are not limited by open-pull-requests-limit and open as soon
# as an advisory lands, whatever the schedule.
#
# History: until 2026-11-02 this grouped minor+patch only and opened each
# major on its own. That produced eleven PRs in one morning (#139-#150), each
# rewriting the same lockfiles, so every merge conflicted the rest.
#
# No `cooldown` yet (zizmor's dependabot-cooldown, ignored on each entry). A
# cooldown holds a new release back for some days before Dependabot offers
# it, which blunts a hijacked release but also delays every fix. That is an
# owner's policy call, not a side effect of adding a linter, so it is left for
# a deliberate change. Security updates are not subject to cooldown either way.

version: 2
updates:
  - package-ecosystem: npm # zizmor: ignore[dependabot-cooldown]
    directories: ["/web", "/backend", "/mcp"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-all:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    ignore:
      # Express 5 is a migration (path syntax, removed APIs, req.query
      # semantics), not a version bump, and 4.x is still patched - the
      # advisories in #122 were all fixed within 4. Revisit deliberately, not
      # from a bot's pull request. Security updates ignore this rule anyway.
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the Go-native compiler). /backend is on it already: it
      # only runs plain `tsc`. /web stays on 5.x because typescript-eslint
      # (which lints /web with type information) declares
      # `typescript: >=4.8.4 <6.1.0` as of 8.72. Revisit when a typescript-eslint
      # release widens that peer range to 7; then bump /web by hand and drop this.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Tailwind 4 (and tailwind-merge 3, which supports only Tailwind 4). Tried
      # with the official `@tailwindcss/upgrade` on 2026-11-02 and measured
      # against 3.4 at 1440x900 and 390x844 on /, /story, /blog, a post,
      # /projects and a project: 11 of 16 full-page shots changed height (up to
      # +136px on the phone home page), so it is a redesign, not a bump. What
      # migrating needs, in order:
      # - index.css's `@layer base/components/utilities` blocks become native
      #   cascade layers in v4, and unlayered rules now beat every utility. The
      #   file was written against v3's hoisting; audit it block by block.
      # - Fix what the tool got wrong, all of which it did silently: it crashed
      #   on the `.text-\[0\.625rem\]` override (rename that selector first);
      #   it rewrote `ActionTone = "outline"` to "outline-solid" (a string, not
      #   a class); it wrote `--font-display: var(--font-display)` and friends
      #   into @theme (self-reference); it turned `body.motion-paused …` into
      #   the invalid `:is(.motion-paused)body …`; and it moved each nested
      #   `@media` mobile floor above the declaration it overrides, so the
      #   desktop size wins on phones.
      # - v4 preflight and default changes (border colour, ring width,
      #   placeholder, button cursor, `space-*` selectors) against the measured
      #   contrast and type ramp.
      # - Re-shoot the same pages to a pixel diff of antialiasing only, then
      #   drop both entries here. Security updates ignore this rule anyway.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]

  # Both Dockerfiles pin their bases by tag AND digest. This is what moves the
  # digest when upstream republishes `node:*-alpine` or `nginx:alpine` with
  # fixed OS packages - without it the pin would freeze the image's CVEs in
  # place, which is the opposite of what it is for.
  - package-ecosystem: docker # zizmor: ignore[dependabot-cooldown]
    directories: ["/web", "/backend"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-all:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  # The action runtimes are why every run warned about Node 20; majors here
  # are where that happens, so they are not ignored.
  - package-ecosystem: github-actions # zizmor: ignore[dependabot-cooldown]
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
