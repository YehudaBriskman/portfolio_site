# zizmor configuration. Run in CI by the Static job (.github/workflows/ci.yml).
#
# Every finding is fixed or carries an inline `# zizmor: ignore[...]` with its
# reason, beside the line it is about. This file holds only what cannot be
# said inline.
rules:
  unpinned-uses:
    config:
      policies:
        # Every action, first-party included, is pinned to a full commit sha
        # with its version in a comment; Dependabot's github-actions entry
        # moves the sha and rewrites the comment. No exceptions since #206
        # pinned the last tag (tailscale/github-action in Deploy).
        "*": hash-pin
