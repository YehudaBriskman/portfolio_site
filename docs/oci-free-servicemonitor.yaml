# NOT APPLIED. A ready-to-apply follow-up for the oci-free repository (#890).
#
# This repository has no Kubernetes manifest: the cluster lives in oci-free
# (k8s/portfolio.yaml). Apply there, in this order:
#
#  1. portfolio.yaml, `api` container: add the port (METRICS_PORT defaults to
#     9464 in the image, so no env change is needed)
#
#         ports:
#           - { name: http, containerPort: 5000 }
#           - { name: metrics, containerPort: 9464 }
#
#     and do NOT add it to the existing public `api` Service or to any
#     Ingress. /metrics must stay off the public path.
#  2. Adjust `namespace` and the `app: api` selector below to the labels the
#     api Deployment really carries (check: kubectl -n <ns> get deploy api
#     -o jsonpath='{.spec.template.metadata.labels}'), and the `release:`
#     label to whatever your Prometheus selects ServiceMonitors by.
#  3. kubectl apply -f this file.
#
# Verify afterwards: Prometheus Targets shows portfolio-api UP, and
#   curl http://<public-host>/metrics   -> the SPA/404, never metrics.
---
apiVersion: v1
kind: Service
metadata:
  name: api-metrics
  namespace: portfolio # adjust
  labels: { app: api, role: metrics }
spec:
  # ClusterIP, in-cluster only. A separate Service so the public one never
  # carries the metrics port.
  type: ClusterIP
  selector: { app: api } # adjust to the api pod labels
  ports:
    - { name: metrics, port: 9464, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: portfolio-api
  namespace: portfolio # adjust
  labels: { release: prometheus } # adjust to your Prometheus's selector
spec:
  selector:
    matchLabels: { app: api, role: metrics }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: portfolio-api
  namespace: portfolio # adjust
  labels: { release: prometheus } # adjust
spec:
  groups:
    - name: portfolio-api
      rules:
        - alert: PortfolioMailSendFailureRatioHigh
          expr: |
            sum(rate(mail_send_total{result="failed"}[15m]))
              / clamp_min(sum(rate(mail_send_total{result=~"ok|failed"}[15m])), 1e-9) > 0.10
            and sum(increase(mail_send_total{result=~"ok|failed"}[15m])) >= 5
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "More than 10% of outgoing mail is failing"
            description: "mail_send_total failed ratio over 15m is above 10% (at least 5 attempts). See docs/newsletter.md, runbook (auth, relay, bounces)."

        - alert: PortfolioApi5xxRatioHigh
          expr: |
            sum(rate(http_requests_total{status_class="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
            and sum(increase(http_requests_total[5m])) >= 20
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "More than 5% of API requests are 5xx"
            description: "Check the api pod logs and the CouchDB reachability (/health/ready)."

        - alert: PortfolioApi5xxRatioCritical
          expr: |
            sum(rate(http_requests_total{status_class="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.20
            and sum(increase(http_requests_total[5m])) >= 20
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "More than 20% of API requests are 5xx"
            description: "The API is largely failing. Roll back the last rollout if it coincides (docs/manual/deploy.md)."

        - alert: PortfolioCampaignQueueStuck
          expr: |
            max(campaign_queue_depth{state="sending"}) > 0
            and sum(increase(mail_send_total{result=~"ok|failed|suppressed"}[30m])) == 0
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "A campaign is sending but no mail has moved for 30 minutes"
            description: "Quiet hours, an owner pause, a held relay or SEND_ENABLED=false also look like this; check the admin Campaigns view first. A sender that stopped ticking shows as time() - campaign_sender_last_tick_timestamp_seconds growing."
