# The headers that belong on every response (four until #124 added a real CSP
# and a Permissions-Policy), in a file rather than in the
# server block, because nginx will not inherit them.
#
# `add_header` does not add to the enclosing block's set: a location that
# declares any add_header of its own replaces the whole inherited list. Every
# location here that sets a Cache-Control was therefore serving its response
# with no HSTS, no nosniff, no Referrer-Policy and no CSP — measured on the
# built image, `curl -I /assets/Blog-Bo3VDjuG.js` came back with
# `Cache-Control: public, max-age=31536000, immutable` and none of the four.
# `/api/` was doing the same by way of its `X-Request-Id`, and so was every
# HTML 404, which reaches `location = /index.html` through the server's
# `error_page 404`.
#
# Included rather than retyped so there is one copy to change, and included by
# every block that declares an add_header rather than only by the ones that
# were caught: the preflight job in .github/workflows/ci.yml fails the build
# when a location sets a header without including this file. A comment asking
# whoever comes next to remember is what the file had before, and it did not
# hold for the five blocks that predate it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# $referrer_policy is a map in nginx.conf.template: no-referrer on the pages and
# API calls whose URL carries a subscribe token, the usual policy elsewhere.
add_header Referrer-Policy $referrer_policy always;

# The Content-Security-Policy, which until #124 was only `frame-ancestors
# 'none'` and so restricted nothing a page loads. Each directive is here
# because of something measured in the built app, not copied from a checklist:
#
#   default-src 'self'     Everything the app fetches is on this origin: the
#                          bundle and its lazy chunks under /assets, the fonts
#                          under /fonts, the API under /api. Anything a later
#                          change pulls from elsewhere fails loudly in the
#                          console rather than shipping quietly.
#
#   script-src 'self'      No inline script and no eval. The one inline
#                          <script> in index.html is the JSON-LD block, and
#                          `type="application/ld+json"` is a data block: the
#                          browser never executes it, so script-src does not
#                          apply to it and it needs neither a hash nor
#                          'unsafe-inline'. The API's rendered heads write the
#                          same kind of block and are covered the same way.
#                          Shiki's highlighter runs on its JavaScript regex
#                          engine, which builds RegExp objects and needs no
#                          'wasm-unsafe-eval'. zod 4 probes for eval with a
#                          caught `new Function("")`, harmless but reported
#                          as a violation on every route, so it runs jitless
#                          (src/lib/zod-csp.ts). This is the directive that
#                          matters: it is what turns an injected <script> into
#                          a console error instead of an exploit.
#
#   style-src 'self' 'unsafe-inline'
#                          Not as loose as it reads, and not avoidable today.
#                          sonner (the toast the reading bar's share button
#                          raises) injects its stylesheet as a <style> element
#                          at module load, which 'self' alone refuses; a hash
#                          would pin the exact bytes of one dependency
#                          version and break silently on its next release.
#                          The risk 'unsafe-inline' admits is CSS injection,
#                          which needs a way to put markup on the page, and
#                          the one route stored content has to the DOM is
#                          react-markdown without rehype-raw, which renders no
#                          raw HTML at all. React's style={{}} props go
#                          through the CSSOM and are not subject to CSP either
#                          way.
#
#   img-src 'self' data: https:
#                          A collection's coverImage and an image in a post's
#                          markdown are any absolute URL by schema
#                          (backend/src/schemas/content.ts), so an image host
#                          cannot be enumerated here. https: keeps them working
#                          and still refuses plain http and every non-image
#                          use; data: is the select's chevron in index.css.
#
#   object-src 'none'      No plugins, ever. Not covered by default-src in
#   base-uri 'none'        practice the way people assume, and a <base> tag is
#   form-action 'self'     how an injection redirects every relative URL; the
#                          contact form posts to /api/email on this origin.
#
#   frame-src 'none'       The site embeds nothing and should be embedded by
#   frame-ancestors 'none' nobody — the original header, kept.
#
# No upgrade-insecure-requests: HSTS already holds the public hosts to https,
# and the directive would rewrite every subresource on a Compose stack served
# from http://localhost to an https:// URL that nothing answers.
#
# Enforced rather than Report-Only, because there is nowhere to send reports
# and because the check that a Report-Only period would buy was run instead:
# every route in en, loaded in Chromium against the built image with this
# policy, logs no violation.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;

# Cross-origin isolation of the browsing context. COOP same-origin cuts the
# window.opener link to pages on other origins; the site opens no popups to
# other origins and uses no OAuth popup flow. CORP same-site stops other
# sites embedding these responses (images, fonts, scripts) with no-cors; the
# site's own pages and its subdomains load them same-site, and the CSP has no
# cross-origin script/font/connect sources. Social scrapers fetch og images
# directly rather than embedding them, so they are not affected.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# Every powerful feature the site does not use, switched off for this origin and
# anything it might ever embed. What is left on is deliberate: the reading bar's
# share button calls navigator.share and falls back to clipboard.writeText, so
# web-share and clipboard-write are not listed; neither is autoplay, which the
# muted plates may use. A denied feature costs nothing until someone tries it,
# and then it is a refusal rather than a prompt.
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=()" always;
