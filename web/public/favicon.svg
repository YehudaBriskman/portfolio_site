<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384" role="img" aria-label="Yehuda Briskman">
  <!--
    The site in one mark: the bust from the portrait on the first screen,
    reduced to its own alpha channel with the round lenses knocked out.

    Two things this format does that a PNG cannot.

    **It has no ground.** The mark is the figure and nothing else, so it sits
    on whatever the browser's tab strip happens to be rather than carrying a
    cream rectangle into a dark one.

    **It picks its own colour.** A tab strip is the one surface on the web a
    site does not get to style, and it is dark for roughly half of everyone.
    `prefers-color-scheme` is the only way an icon can answer that, and only
    an SVG favicon can carry it — which is why this file exists alongside the
    .ico. Measured in Chromium, sampling the painted bitmap at (250,170):
    rgb(20,19,15) under `colorScheme: light`, rgb(235,236,240) under `dark`,
    and rgba(0,0,0,0) in the corner under both. The dark value is the ink
    inverted rather than the site's paper (#ECE8DC): drawing the mark in
    #131723 instead would land exactly on paper in dark and a blue-black in
    light, and the light tab strip is both the commoner case and the one
    where the brand ink is worth being exact about. Safari does not
    honour it and falls back to the .ico, where the ink version is what it
    gets; that is the right way round, since Safari's tab strip is light by
    default.

    **Why an inverted bitmap rather than a mask.** There is no tracer in this
    toolchain, so the mark is a bitmap either way: a 2-colour PNG at 384px,
    1,428 bytes, which base64 carries at about 1.9kB. The obvious shape —
    a `rect` filled with a themed colour through a `<mask>` whose content is
    the silhouette — does not render: Chromium paints the rect unmasked, so
    the icon is a solid square in both schemes. A `filter: invert(1)` on the
    image itself inverts the ink to paper and leaves the alpha channel alone,
    which is the same result with one moving part instead of three. A traced
    path would beat both and is the thing to do if a tracer is ever added;
    it is not worth hand-authoring a bezier of someone's hair to save 2kB.

    The lenses are holes rather than a second shape, so they take the tab's
    own colour and stay visible on both grounds without a second rule.
  -->
  <style>
    @media (prefers-color-scheme: dark) { .ink { filter: invert(1); } }
  </style>
  <image class="ink" width="384" height="384" href="data:image/png;base64,"/>
</svg>
