<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384" role="img" aria-label="Yehuda Briskman">
  <!--
    The site in one mark: the bust from the portrait on the first screen,
    reduced to its own alpha channel with the round lenses knocked out, set
    on a white disc.

    **Why the disc.** This mark used to have no ground and to pick its own
    colour through `prefers-color-scheme`, inverting to near-white on a dark
    OS. That reads the OS setting, not the tab strip's: a browser with its
    own dark theme on a light OS painted ink on near-black, and the figure
    disappeared (reported by the owner from a dark Chrome tab). A disc
    makes the icon carry its own ground, so it is legible on every strip
    with no colour-scheme rule at all, and the lenses — holes — now show
    the disc's white, which is what makes them read as glasses.

    **The geometry**, shared with every raster icon (they are all built from
    this file by `scripts/brand/build-icons.py`): the figure is 86% of the
    disc's diameter, centred, and dropped to the bottom so the shoulders run
    off the edge and are clipped by the disc, like a portrait in a roundel.

    **Why a bitmap and not a path.** There is no tracer in this toolchain, so
    the figure is a 2-colour PNG at 384px, about 1.9kB as base64. A traced
    path would beat it and is the thing to do if a tracer is ever added.
  -->
  <defs><clipPath id="disc"><circle cx="192" cy="192" r="192"/></clipPath></defs>
  <circle cx="192" cy="192" r="192" fill="#fff"/>
  <image clip-path="url(#disc)" x="27" y="54" width="330" height="330" href="data:image/png;base64,"/>
</svg>
