<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yehuda Briskman &middot; Full-stack engineer &amp; team lead</title>

    <!--
      These are the defaults for the shell. Content routes (/blog/*, /projects/*)
      are served by the API with this head rewritten per URL, because crawlers do
      not run JavaScript and would otherwise read the home page's tags on every
      URL of the site. See backend/src/services/seo.ts.
      Kept at or under ~155 characters, which is where Google truncates.
    -->
    <meta name="description" content="Full-stack engineer and team lead in Tel Aviv. I ship products end to end and build the checks that prove they still work." />
    <link rel="canonical" href="https://yehudabriskman.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Yehuda Briskman" />
    <meta name="theme-color" content="#0F1515" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Yehuda Briskman · Notes" href="/feed.xml" />

    <!-- Absolute URLs throughout: every crawler resolves og:image against its
         own base, and a relative path silently yields no preview at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yehuda Briskman" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Yehuda Briskman &middot; Full-stack engineer &amp; team lead" />
    <meta property="og:description" content="I ship products end to end, and build the checks that prove they work. Tel Aviv." />
    <meta property="og:url" content="https://yehudabriskman.com/" />
    <meta property="og:image" content="https://yehudabriskman.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yehuda Briskman, full-stack engineer and team lead" />

    <!-- X does not read Open Graph by default, so the same facts are repeated
         under its own prefix rather than assumed to carry over. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yehuda Briskman &middot; Full-stack engineer &amp; team lead" />
    <meta name="twitter:description" content="I ship products end to end, and build the checks that prove they work. Tel Aviv." />
    <meta name="twitter:image" content="https://yehudabriskman.com/og.png" />
    <meta name="twitter:image:alt" content="Yehuda Briskman, full-stack engineer and team lead" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://yehudabriskman.com/#person",
            "name": "Yehuda Briskman",
            "url": "https://yehudabriskman.com/",
            "image": "https://yehudabriskman.com/img/yehuda-cut.webp",
            "jobTitle": "Full-stack engineer and team lead",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Tel Aviv",
              "addressCountry": "IL"
            },
            "sameAs": ["https://github.com/YehudaBriskman", "https://windom.app"]
          },
          {
            "@type": "WebSite",
            "@id": "https://yehudabriskman.com/#website",
            "url": "https://yehudabriskman.com/",
            "name": "Yehuda Briskman",
            "inLanguage": "en",
            "publisher": { "@id": "https://yehudabriskman.com/#person" }
          }
        ]
      }
    </script>

    <!-- Fonts are served from this origin; see the @font-face block in
         index.css. Preload only the two the first screen needs, so they start
         with the HTML rather than after the stylesheet is parsed. -->
    <link rel="preload" href="/fonts/archivo-400-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The mono face is used by every label on the page, but nothing in the
         HTML references it — it is reached only once React has rendered, so
         it was starting 2127ms in, behind the bundle, and finishing after
         2836ms. That is a half-second of labels in the fallback face on a
         throttled connection. -->
    <link rel="preload" href="/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
