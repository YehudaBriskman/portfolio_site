<!DOCTYPE html>
<!-- `dir` as well as `lang`: both are read by the stylesheet before React
     exists, and `nav/locale.ts` rewrites the pair together when the language
     changes. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yehuda Briskman &middot; Full-stack engineer &amp; team lead</title>

    <!--
      These are the defaults for the shell. Content routes (/blog/*, /projects/*)
      are served by the API with this head rewritten per URL, because crawlers do
      not run JavaScript and would otherwise read the home page's tags on every
      URL of the site. See backend/src/services/seo.ts.
      Kept at or under ~155 characters, which is where Google truncates.
    -->
    <meta name="description" content="Full-stack engineer and team lead in Tel Aviv. I ship products end to end and build the checks that prove they still work." />
    <link rel="canonical" href="https://yehudabriskman.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Yehuda Briskman" />
    <!-- Paper, because that is the ground the site is actually on. Both of
         these said #0F1515 / dark, which was the palette before the gallery
         rebuild and is now nowhere in the stylesheet: the browser painted a
         near-black canvas and dark form controls for the moment before the CSS
         landed, then flipped to cream. -->
    <meta name="theme-color" content="#ECE8DC" />
    <meta name="color-scheme" content="light" />

    <!-- The SVG first, and it is not decoration: it is the only one of these
         that can answer `prefers-color-scheme`. A tab strip is the one
         surface on the web a site does not get to style and it is dark for
         roughly half of everyone, so the mark paints ink on a light strip and
         paper on a dark one, over a transparent ground in both. The .ico is
         the fallback for Safari and for anything that ignores the SVG, and it
         carries 48/32/16 so the tab gets a size drawn for it rather than a
         512 squeezed down. Both are the same bust; see the note in
         favicon.svg for why it is an inverted bitmap and not a traced path. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Yehuda Briskman · Notes" href="/feed.xml" />

    <!-- Absolute URLs throughout: every crawler resolves og:image against its
         own base, and a relative path silently yields no preview at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yehuda Briskman" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Yehuda Briskman &middot; Full-stack engineer &amp; team lead" />
    <meta property="og:description" content="I ship products end to end, and build the checks that prove they work. Tel Aviv." />
    <meta property="og:url" content="https://yehudabriskman.com/" />
    <meta property="og:image" content="https://yehudabriskman.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yehuda Briskman, full-stack engineer and team lead" />

    <!-- X does not read Open Graph by default, so the same facts are repeated
         under its own prefix rather than assumed to carry over. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yehuda Briskman &middot; Full-stack engineer &amp; team lead" />
    <meta name="twitter:description" content="I ship products end to end, and build the checks that prove they work. Tel Aviv." />
    <meta name="twitter:image" content="https://yehudabriskman.com/og.png" />
    <meta name="twitter:image:alt" content="Yehuda Briskman, full-stack engineer and team lead" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://yehudabriskman.com/#person",
            "name": "Yehuda Briskman",
            "url": "https://yehudabriskman.com/",
            "image": "https://yehudabriskman.com/img/yehuda-cut.webp",
            "jobTitle": "Full-stack engineer and team lead",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Tel Aviv",
              "addressCountry": "IL"
            },
            "sameAs": ["https://github.com/YehudaBriskman", "https://windom.app"]
          },
          {
            "@type": "WebSite",
            "@id": "https://yehudabriskman.com/#website",
            "url": "https://yehudabriskman.com/",
            "name": "Yehuda Briskman",
            "inLanguage": "en",
            "publisher": { "@id": "https://yehudabriskman.com/#person" }
          }
        ]
      }
    </script>

    <!-- Fonts are served from this origin; see the @font-face block in
         index.css. Preload only what the first screen needs, so those files
         start with the HTML rather than after the stylesheet is parsed.

         Two, and which two changed when the roles did. The first screen is
         a title plate and a plate is three roles at once — the name in
         display, the fact line in the accent, the field line in data — but
         the accent face is the most expensive file in the set and it is
         spent on one line of seven words:

           audiowide-400        13,816   the name, and the LCP element
           comic-relief-400     18,032   the field line, the nav, all prose
           jim-nightshade-400   51,532   "Full-stack, mostly frontend"

         So the accent comes off the critical path. Preloaded bytes go
         104,812 (the two Archivo files this started as) to 83,380 (three
         faces, when the text role was still the script) to **31,848**. The
         fact line now swaps a moment after first paint, which is the right
         trade for the one line on the screen that is neither the heading nor
         the thing being measured.

         comic-relief-700 (22,740) is not here either, and that is a closer
         call than it was: it used to be reached only by emphasis inside
         prose, and it is now the heading voice everywhere below the section
         register — every object name, every `.display-tight`. None of those
         are on the home page's first screen. The first card's name on
         /projects is, and that page is the one to measure before deciding
         this stays a two-file preload.

         English only, and that is a limitation rather than an oversight. The
         language is chosen at runtime by `nav/locale.ts`, so a static
         preload cannot know it; preloading both languages would make every
         English reader pay for Hebrew they will never see. The Hebrew files
         start when the stylesheet resolves, which is what every font on this
         site did before the first preload was added. -->
    <link rel="preload" href="/fonts/audiowide-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The text face carries the field line, the nav and every paragraph on
         the page, and nothing in the HTML references it — it is reached only
         once React has rendered, so it was starting 2127ms in, behind the
         bundle, and finishing after 2836ms. That is a half-second of the
         whole page in the fallback face on a throttled connection. -->
    <link rel="preload" href="/fonts/comic-relief-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
