<!DOCTYPE html><html><head><meta charset="utf-8">
<!--
  Issue #97: what the reading-face swap does to line lengths, and the number
  `size-adjust: 108.9%` in index.css comes from. Widths of the strings that
  are budgeted against — the field line at both roots, a running paragraph,
  the hero's ask link, the alphabet — in Comic Relief, in Atkinson Hyperlegible
  Next at 100%, and at 108.9% (Comic Relief's x-height). Measured in the DOM
  so kerning and tracking are in the number. Serve `web/` on 4227, run
  probe-reading-face.sh first (for the Comic Relief files, which no longer
  ship), then read `document.body.dataset.out`.
-->

<style>
@font-face { font-family: 'CR'; src: url('probe/comic-relief-400.woff2'); font-weight: 400; }
@font-face { font-family: 'CR'; src: url('probe/comic-relief-700.woff2'); font-weight: 700; }
@font-face { font-family: 'AN'; src: url('../../public/fonts/atkinson-hyperlegible-next-400-700.woff2'); font-weight: 400 700; }
@font-face { font-family: 'AN109'; src: url('../../public/fonts/atkinson-hyperlegible-next-400-700.woff2'); font-weight: 400 700; size-adjust: 108.9%; }
</style></head><body><script type="module">
const S = {
  field: ['FULL-STACK · REACT 19 · IN USE TODAY · 9 YEARS', 11.52 * 1.0625, 0.18, 400, true],
  fieldDesk: ['FULL-STACK · REACT 19 · IN USE TODAY · 9 YEARS', 11.52, 0.18, 400, true],
  body: ['I ship products end to end and build the checks that prove they still work. Nine years of it, mostly in places where the thing had to go out on a date somebody else had already promised.', 19, 0, 400],
  ask: ['See the work', 17, -0.005, 700],
  lower: ['abcdefghijklmnopqrstuvwxyz', 100, 0, 400],
};
function w(face, [t, size, tr, wt]) {
  const s = document.createElement('span');
  s.style.cssText = `position:absolute;white-space:pre;font:${wt} ${size}px ${face};letter-spacing:${tr}em`;
  s.textContent = t; document.body.append(s);
  const r = s.getBoundingClientRect().width; s.remove(); return r;
}
await Promise.all(['CR','AN','AN109'].flatMap(f => [document.fonts.load(`400 16px ${f}`), document.fonts.load(`700 16px ${f}`)]));
const out = {};
for (const [k, v] of Object.entries(S)) out[k] = Object.fromEntries(['CR','AN','AN109'].map(f => [f, +w(f, v).toFixed(1)]));
document.body.dataset.out = JSON.stringify(out);
document.documentElement.dataset.ready = '1';
</script></body></html>
