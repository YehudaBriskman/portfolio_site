# The request headers every proxied location hands the API, in a file for the
# same reason security-headers.conf is one.
#
# `proxy_set_header` inherits the way `add_header` does: not at all, once a
# block declares one of its own. Every proxy_pass location here sets a Host, so
# none of them inherits anything, and each one forwards exactly the headers it
# lists. Until #121 /api/ listed five and the eight SEO locations listed two —
# Host and X-Forwarded-Proto — so a rendered page, the sitemap, the feed and
# robots.txt reached the API with no X-Forwarded-For at all. Express then read
# nginx's own pod address as the client and keyed the SEO limiter on it: one
# bucket of 600 a minute shared by every crawler and every visitor to /blog.
#
# One list, included by every location that has a proxy_pass, and
# web/src/test/nginx-config.test.ts fails when one does not.
#
# X-Forwarded-For is the one the API's `trust proxy` count depends on. Traefik
# writes the client's address; `$proxy_add_x_forwarded_for` appends Traefik's
# (nginx's $remote_addr) after it, so the chain the API reads is
# "<client>, <traefik>" from the socket of nginx — two hops, which is the 2 in
# backend/src/app.ts. Replacing the header with $remote_addr instead would drop
# the client and leave only Traefik, and the API would be back to one bucket.
proxy_set_header Host               $host;
proxy_set_header X-Request-Id       $request_id;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
