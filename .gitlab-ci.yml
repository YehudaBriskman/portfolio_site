variables:
  FRONT_DIR: "glassglow-folio-space" # the front folder
  BACK_DIR: "backend" # the back folder
  NODE_ENV: "ci" # node environment to ci proccess
  NPM_CONFIG_FUND: "false" # cancle popups for funding npm
  NPM_CONFIG_AUDIT: "false" # cancle AUDIT becouse the ci proccess can blow-up on vulnerabilities
  CI_IMAGE_TAG: "${CI_COMMIT_SHA}" # tag the for docker images
  DOCKER_BUILDKIT: "1" # we dont need for kaniko but if its local-docker you need so for the next step (local K8's)
  ENABLE_DIND: "0" # the flag for compose-smoke jub

# ! WORKFLOW RULES !

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - changes:
        compare_to: "refs/heads/main"
        paths:
          - "**/*"
      when: always

stages:
  - verify
  - lint
  - test
  - build
  - docker
  - compose
  - scan


# ! DEFAULT NODES !

.default-node: &default_node
  image: node:20
  cache:
    key:
      files:
        - $FRONT_DIR/package-lock.json
    paths:
      - $FRONT_DIR/node_modules/
  before_script: &default_before_script
    - corepack enable || true
    - cd "$FRONT_DIR"

.default-node-backend: &default_node_backend
  image: node:20
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules/
  before_script:
    - cd "$BACK_DIR"

# ! DEFAULT RULES !

.rules-frontend: &rules_frontend
  rules:
    - changes:
        - $FRONT_DIR/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

.rules-backend: &rules_backend
  rules:
    - changes:
        - $BACK_DIR/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ! VERIFY !

preflight:
  stage: verify
  image: alpine:3.20
  before_script:
    - set -Eeuo pipefail
    - apk add --no-cache bash coreutils
  script: |
    set -Eeuo pipefail

    echo "Running basic preflight sanity checks..."

    # FRONTEND checks
    [ -d "$FRONT_DIR" ] || { echo "Missing $FRONT_DIR directory"; exit 1; }
    [ -f "$FRONT_DIR/package.json" ] || { echo "Missing $FRONT_DIR/package.json"; exit 1; }
    [ -f "$FRONT_DIR/package-lock.json" ] || { echo "Missing $FRONT_DIR/package-lock.json"; exit 1; }
    [ -f "$FRONT_DIR/Dockerfile" ] || { echo "Missing $FRONT_DIR/Dockerfile"; exit 1; }
    [ -f "$FRONT_DIR/nginx.conf" ] || { echo "Missing $FRONT_DIR/nginx.conf (skipping syntax check)"; }

    # BACKEND checks
    [ -d "$BACK_DIR" ] || { echo "Missing $BACK_DIR directory"; exit 1; }
    [ -f "$BACK_DIR/package.json" ] || { echo "Missing $BACK_DIR/package.json"; exit 1; }
    [ -f "$BACK_DIR/package-lock.json" ] || { echo "Missing $BACK_DIR/package-lock.json"; exit 1; }
    [ -f "$BACK_DIR/Dockerfile" ] || { echo "Missing $BACK_DIR/Dockerfile"; exit 1; }

    echo "Preflight passed: all required files exist."
  rules:
    - when: always
  interruptible: true

lint-frontend:
  stage: lint
  <<: [*default_node, *rules_frontend]
  before_script:
    - *default_before_script
  script:
    - npm ci
    - npm run lint

hadolint-frontend:
  stage: lint
  image: hadolint/hadolint:latest-alpine
  <<: *rules_frontend
  script:
    - hadolint --failure-threshold error "$FRONT_DIR/Dockerfile"
  interruptible: true
  rules:
    - exists:
        - $FRONT_DIR/Dockerfile

test-frontend:
  stage: test
  <<: [*default_node, *rules_frontend]
  before_script:
    - *default_before_script
    - npm ci --no-audit --no-fund
  script:
    - npm test
  artifacts:
    when: always
  interruptible: true

build-frontend:
  stage: build
  <<: [*default_node, *rules_frontend]
  before_script:
    - *default_before_script
    - npm ci --no-audit --no-fund
  script:
    - npm run build
    - ls -lh dist/
  artifacts:
    paths:
      - $FRONT_DIR/dist/
      - $FRONT_DIR/nginx.app.conf
      - $FRONT_DIR/nginx.root.conf
      - $FRONT_DIR/Dockerfile
      - $FRONT_DIR/package.json
      - $FRONT_DIR/package-lock.json
    expire_in: 2 hours
  needs: ["test-frontend", "lint-frontend", "hadolint-frontend"]
  interruptible: true

build-container-frontend:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    ["build-frontend", "test-frontend", "lint-frontend", "hadolint-frontend"]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/${FRONT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/${FRONT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/web:latest"
      --cache=true
      --single-snapshot
      --reproducible
  interruptible: true
  rules:
    - exists:
        - $FRONT_DIR/Dockerfile

hadolint-backend:
  stage: lint
  image: hadolint/hadolint:latest-alpine
  <<: *rules_backend
  script:
    - hadolint --failure-threshold error "$BACK_DIR/Dockerfile"
  interruptible: true
  rules:
    - exists:
        - $BACK_DIR/Dockerfile

test-backend:
  stage: test
  <<: [*default_node_backend, *rules_backend]
  script:
    - npm ci --no-audit --no-fund
    - npm run lint --if-present
    - npm test --if-present
  artifacts:
    when: always
  interruptible: true

build-backend:
  stage: build
  <<: [*default_node_backend, *rules_backend]
  script:
    - npm ci --no-audit --no-fund
    - npm run build
    - ls -lh dist/ || true
  artifacts:
    paths:
      - $BACK_DIR/dist/
      - $BACK_DIR/package.json
      - $BACK_DIR/package-lock.json
      - $BACK_DIR/tsconfig.json
      - $BACK_DIR/Dockerfile
    expire_in: 2 hours
  needs: ["test-backend", "hadolint-backend"]
  interruptible: true

build-container-backend:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  <<: *rules_backend
  needs: ["test-backend", "build-backend", "hadolint-backend"]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/api:latest"
      --cache=true
      --single-snapshot
      --reproducible
  interruptible: true
  rules:
    - exists:
        - backend/Dockerfile

# ! COMPOSE CHECKS !

compose-config:
  stage: compose
  image: alpine:3.20
  rules:
    - exists:
        - "docker-compose.yml"
      when: always
    - exists:
        - "docker-compose.ci.yml"
      when: always
    - when: never
  before_script:
    - set -Eeuo pipefail
    - apk add --no-cache docker-cli docker-cli-compose
  script: |
    set -Eeuo pipefail
    FILE="docker-compose.ci.yml"
    [ -f "$FILE" ] || FILE="docker-compose.yml"
    echo "Validating compose file: $FILE"
    docker compose -f "$FILE" config 1>/dev/null
    echo "docker compose config OK"
  needs:
    - job: build-container-frontend
      optional: true
    - job: build-container-backend
      optional: true

compose-smoke:
  stage: compose
  image: docker:25-cli
  services:
    - name: docker:25-dind
      command: ["--mtu=1450"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    COMPOSE_FILE: docker-compose.ci.yml
  rules:
    - if: '$ENABLE_DIND == "1"'
      exists:
        - "docker-compose.ci.yml"
  before_script:
    - set -Eeuo pipefail
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script: |
    set -Eeuo pipefail
    sed -i "s#\${WEB_IMAGE:-.*}#${CI_REGISTRY_IMAGE}/web:${CI_IMAGE_TAG}#g" "$COMPOSE_FILE" || true
    sed -i "s#\${API_IMAGE:-.*}#${CI_REGISTRY_IMAGE}/api:${CI_IMAGE_TAG}#g" "$COMPOSE_FILE" || true

    docker compose -f "$COMPOSE_FILE" pull --ignore-pull-failures || true
    docker compose -f "$COMPOSE_FILE" up -d
    sleep 3
    docker compose -f "$COMPOSE_FILE" ps
    docker compose -f "$COMPOSE_FILE" down -v
  needs:
    - build-container-frontend
    - build-container-backend
  allow_failure: true

# ! SECURITY SCANS !

trivy-frontend:
  stage: scan
  cache:
    key: trivy-db-frontend
    paths:
      - .trivycache/
  image: aquasec/trivy:latest
  <<: *rules_frontend
  needs: ["build-container-frontend"]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  before_script:
  - mkdir -p .trivycache
  script:
    - trivy image --cache-dir .trivycache
        --username "$TRIVY_USERNAME"
        --password "$TRIVY_PASSWORD"
        --severity HIGH,CRITICAL
        --exit-code 0
        --scanners vuln
        --no-progress
        "${CI_REGISTRY_IMAGE}/web:${CI_IMAGE_TAG}"
  allow_failure: true

trivy-backend:
  stage: scan
  cache:
    key: trivy-db-backend
    paths:
      - .trivycache/
  image: aquasec/trivy:latest
  <<: *rules_backend
  needs: ["build-container-backend"]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  before_script:
  - mkdir -p .trivycache
  script:
    - trivy image --cache-dir .trivycache
        --username "$TRIVY_USERNAME"
        --password "$TRIVY_PASSWORD"
        --severity HIGH,CRITICAL
        --exit-code 0
        --scanners vuln            
        --no-progress
        "${CI_REGISTRY_IMAGE}/api:${CI_IMAGE_TAG}"
  allow_failure: true