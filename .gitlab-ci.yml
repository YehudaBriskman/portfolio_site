variables:
  FRONT_DIR: "glassglow-folio-space"
  BACK_DIR: "backend"
  NODE_ENV: "ci"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  CI_IMAGE_TAG: "${CI_COMMIT_SHA}"
  DOCKER_BUILDKIT: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - changes:
        compare_to: "refs/heads/main"
        paths:
          - "**/*"
      when: always

stages:
  - verify
  - lint
  - test
  - build
  - security
  - docker
  - scan

.default-node: &default_node
  image: node:20
  cache:
    key:
      files:
        - $FRONT_DIR/package-lock.json
    paths:
      - $FRONT_DIR/node_modules/
  before_script: &default_before_script
    - corepack enable || true
    - cd "$FRONT_DIR"

.default-node-backend: &default_node_backend
  image: node:20
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules/
  before_script:
    - cd "$BACK_DIR"

.rules-frontend: &rules_frontend
  rules:
    - changes:
        - $FRONT_DIR/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

.rules-backend: &rules_backend
  rules:
    - changes:
        - $BACK_DIR/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ===== Verify (Preflight) =====
preflight:
  stage: verify
  image: alpine:3.20
  before_script:
    - set -Eeuo pipefail
    - apk add --no-cache bash grep coreutils nginx
  script: |
    [ -d "$FRONT_DIR" ] || { echo "Missing $FRONT_DIR"; exit 1; }
    [ -f "$FRONT_DIR/package.json" ] || { echo "Missing $FRONT_DIR/package.json"; exit 1; }
    [ -f "$FRONT_DIR/package-lock.json" ] || { echo "Missing $FRONT_DIR/package-lock.json"; exit 1; }
    [ -f "$FRONT_DIR/Dockerfile" ] || { echo "Missing $FRONT_DIR/Dockerfile"; exit 1; }
    [ -f "$FRONT_DIR/nginx.root.conf" ] || { echo "Missing $FRONT_DIR/nginx.root.conf"; exit 1; }
    [ -f "$FRONT_DIR/nginx.app.conf" ] || { echo "Missing $FRONT_DIR/nginx.app.conf"; exit 1; }

    [ -d "$BACK_DIR" ] || { echo "Missing $BACK_DIR"; exit 1; }
    [ -f "$BACK_DIR/package.json" ] || { echo "Missing $BACK_DIR/package.json"; exit 1; }
    [ -f "$BACK_DIR/package-lock.json" ] || { echo "Missing $BACK_DIR/package-lock.json"; exit 1; }
    [ -f "$BACK_DIR/Dockerfile" ] || { echo "Missing $BACK_DIR/Dockerfile"; exit 1; }

    nginx -t -c "$(pwd)/$FRONT_DIR/nginx.root.conf" || { echo "nginx.root.conf invalid"; exit 1; }
    nginx -t -c "$(pwd)/$FRONT_DIR/nginx.app.conf"  || { echo "nginx.app.conf invalid"; exit 1; }

  rules:
    - when: always
  interruptible: true

# ===== Lint =====
lint-frontend:
  stage: lint
  <<: [*default_node, *rules_frontend]
  before_script:
    - *default_before_script
  script:
    - npm ci
    - npm run lint

# ===== Test =====
test-frontend:
  stage: test
  <<: [*default_node, *rules_frontend]
  before_script:
    - *default_before_script
    - npm ci --no-audit --no-fund
  script:
    - npm test -- --ci --reporters=default --reporters=jest-junit
  artifacts:
    when: always
    reports:
      junit: "$FRONT_DIR/junit.xml"
  needs: ["lint-frontend"]
  interruptible: true

# ===== Build =====
build-frontend:
  stage: build
  <<: [*default_node, *rules_frontend]
  before_script:
    - *default_before_script
    - npm ci --no-audit --no-fund
  script:
    - npm run build
    - ls -lh dist/
  artifacts:
    paths:
      - $FRONT_DIR/dist/
      - $FRONT_DIR/nginx.app.conf
      - $FRONT_DIR/nginx.root.conf
      - $FRONT_DIR/Dockerfile
      - $FRONT_DIR/package.json
      - $FRONT_DIR/package-lock.json
    expire_in: 2 hours
  needs: ["test-frontend", "lint-frontend"]
  interruptible: true

# ===== Security: Dockerfile lint (frontend) =====
hadolint-frontend:
  stage: security
  image: hadolint/hadolint:latest-alpine
  <<: *rules_frontend
  script:
    - hadolint "$FRONT_DIR/Dockerfile"
  needs: ["build-frontend"]
  interruptible: true

# ===== Docker Image =====
build-container-frontend:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    ["build-frontend", "test-frontend", "lint-frontend", "hadolint-frontend"]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/${FRONT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/${FRONT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/web:latest"
      --cache=true
      --single-snapshot
      --reproducible
  interruptible: true
  rules:
    - exists:
        - $FRONT_DIR/Dockerfile

# ===== Test =====
test-backend:
  stage: test
  <<: [*default_node_backend, *rules_backend]
  script:
    - npm ci --no-audit --no-fund
    - npm run lint --if-present
    - npm test --if-present
  artifacts:
    when: always
    reports:
      junit: "$BACK_DIR/junit.xml"
  interruptible: true

# ===== Build =====
build-backend:
  stage: build
  <<: [*default_node_backend, *rules_backend]
  script:
    - npm ci --no-audit --no-fund
    - npm run build
    - ls -lh dist/ || true
  artifacts:
    paths:
      - $BACK_DIR/dist/
      - $BACK_DIR/package.json
      - $BACK_DIR/package-lock.json
      - $BACK_DIR/tsconfig.json
      - $BACK_DIR/Dockerfile
    expire_in: 2 hours
  needs: ["test-backend"]
  interruptible: true

hadolint-backend:
  stage: security
  image: hadolint/hadolint:latest-alpine
  <<: *rules_backend
  script:
    - hadolint "$BACK_DIR/Dockerfile"
  needs: ["build-backend"]
  interruptible: true
  rules:
    - exists:
        - $BACK_DIR/Dockerfile

# ===== Docker Image =====
build-container-backend:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  <<: *rules_backend
  needs: ["test-backend", "build-backend", "hadolint-backend"]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/api:latest"
      --cache=true
      --single-snapshot
      --reproducible
  interruptible: true
  rules:
    - exists:
        - backend/Dockerfile

trivy-frontend:
  stage: scan
  image: aquasec/trivy:latest
  <<: *rules_frontend
  needs: ["build-container-frontend"]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "${CI_REGISTRY_IMAGE}/web:${CI_IMAGE_TAG}"
  allow_failure: true

trivy-backend:
  stage: scan
  image: aquasec/trivy:latest
  <<: *rules_backend
  needs: ["build-container-backend"]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "${CI_REGISTRY_IMAGE}/api:${CI_IMAGE_TAG}"
  allow_failure: true