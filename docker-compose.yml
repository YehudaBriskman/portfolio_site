services:
  web:
    build: ./web
    image: portfolio_site-web:latest
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      # Gitignored, so a clean checkout has none. Without `required: false`
      # even `docker compose config` fails, which made the file unverifiable
      # anywhere but a machine that had already been set up by hand.
      - path: ./backend/.env
        required: false
    expose:
      - "5000"
    environment:
      - PORT=5000
    restart: unless-stopped
