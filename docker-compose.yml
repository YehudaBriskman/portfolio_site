services:
  web:
    build: ./glassglow-folio-space
    image: portfolio_site-web:latest
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    environment:
      - PORT=5000
    restart: unless-stopped
